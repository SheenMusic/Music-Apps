<title>和弦记号 06 · 综合分析｜课后练习</title>

<body>
<div id="practiceApp">
  <main class="app-container">
    <header class="app-header">
      <div class="header-top-bar">
        <span class="header-title-left">MUSIC THEORY · CHORD SYMBOL</span>
        <div class="header-right-group"><span class="header-title-right">LESSON 06</span></div>
      </div>
    </header>

    <section class="card-container snowman-card">
      <div class="start-header">
        <p class="subtitle">和弦记号 · 第六课 · 综合分析</p>
        <h1 class="main-title">Do You Want to Build a Snowman?</h1>
        <p class="snowman-hint">这份乐谱浓缩了我们全部课程的和弦分析和标记知识，这次分析没有标准答案，做完后不会自动评分，所以，大胆地在谱子上标注一切你认为可能的和弦吧！写完后点「提交」，老师批改后会和你分享你的结果。</p>
      </div>

      <div class="toolbar" role="toolbar" aria-label="播放与显示">
        <button class="tool tool-play" id="play" type="button" aria-label="播放">
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        </button>
        <input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="录音进度">
        <button class="tool" id="wrap" type="button" aria-pressed="false" aria-label="换行显示" title="换行显示">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h13a3 3 0 0 1 0 6h-4m0 0 2-2m-2 2 2 2M4 17h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool" id="zoomOut" type="button" aria-label="缩小" title="缩小">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 10.5h5M15 15l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="tool" id="zoomIn" type="button" aria-label="放大" title="放大">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 10.5h5M10.5 8v5M15 15l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="strip" tabindex="0" aria-label="全曲乐谱，可滚动"><div id="score"></div></div>

      <section id="editor" class="editor" hidden aria-label="和弦记号输入">
        <div class="editor-title"><strong id="positionLabel"></strong><button class="text-btn" id="deleteEntry" type="button">删除</button></div>
        <div class="field-host"></div>
      </section>

      <div id="feedback" class="snowman-feedback" role="status" aria-live="polite"></div>
      <div id="answers" class="snowman-answers" hidden></div>

      <div class="snowman-actions">
        <button class="primary-btn" id="submit" type="button">提交</button>
        <button class="secondary-btn" id="copy" type="button" hidden>复制作答</button>
      </div>
      <div class="snowman-footer">
        <span>作答保存在这台设备的浏览器里，7 天内可以继续。</span>
        <button class="text-btn" id="clear" type="button">重新作答</button>
      </div>
    </section>
  </main>
</div>
<audio id="audio" src="snowman.m4a" preload="metadata"></audio>
