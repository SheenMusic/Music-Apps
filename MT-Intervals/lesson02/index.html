const $=s=>document.querySelector(s); const home=$('#home'),lesson=$('#lesson'),summary=$('#summary'),body=$('#stepExplanation'),board=$('#lessonBoard');
let current=0, audioCtx=null;
const learningState={q2:null,q3:null,q4:null,flat4:false,degree5:0,odd5:'ll',even5:'ls',build6:null,mode7:'up',example8:null,pitch8:null,example9a:'e4',example9b:'fs4'};
const noteFreq={c4:261.626,cs4:277.183,d4:293.665,ds4:311.127,e4:329.628,f4:349.228,fs4:369.994,g4:391.995,gs4:415.305,a4:440,as4:466.164,b4:493.883,c5:523.251,d5:587.33,e5:659.255,f5:698.456,g5:783.991};
const chromatic=['c4','cs4','d4','ds4','e4','f4','fs4','g4','gs4','a4','as4','b4','c5'];
const degreeNotes=['c4','d4','e4','f4','g4','a4','b4','c5']; const degreeCN=['一度','二度','三度','四度','五度','六度','七度','八度'];
function ac(){if(!audioCtx||audioCtx.state==='closed') audioCtx=new (window.AudioContext||window.webkitAudioContext)();return audioCtx}
function wakeAudio(){const c=ac();if(c.state==='suspended')c.resume().catch(()=>{});return c}
function synth(note,d=.72,when=0){const c=wakeAudio(),t=c.currentTime+when,f=noteFreq[note]||noteFreq[note.replace('eb','ds').replace('gb','fs')]||440;const master=c.createGain();master.gain.setValueAtTime(.0001,t);master.gain.exponentialRampToValueAtTime(.20,t+.006);master.gain.exponentialRampToValueAtTime(.065,t+.09);master.gain.exponentialRampToValueAtTime(.0001,t+d);master.connect(c.destination);[[1,'triangle',1],[2,'sine',.13],[3,'sine',.045]].forEach(([m,type,level])=>{const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f*m,t);g.gain.value=level;o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03)})}
function play(note,d=.72,delay=0){wakeAudio();synth(note,d,delay)}
function semitonePath(a,b){let ia=chromatic.indexOf(a),ib=chromatic.indexOf(b);if(ia<0||ib<0)return [];if(ia>ib)[ia,ib]=[ib,ia];return chromatic.slice(ia,ib+1)}
function vf(){return window.Vex&&window.Vex.Flow?window.Vex.Flow:window.VexFlow}
function parseNote(n){const m=n.match(/^([a-g])(s|b)?(\d)$/);return {letter:m[1],acc:m[2]||'',oct:m[3]}}
function drawStaff(el,notes,{clef='treble',harmonic=false}={}){el.innerHTML='';const VF=vf();if(!VF){el.innerHTML='<div class="theory-note" style="padding:40px;text-align:center">五线谱组件未载入，请检查网络连接。</div>';return}try{const w=responsiveStaffWidth(el,260,760),r=NotationRenderer.createRenderer(el);r.resize(w,140);const ctx=r.getContext(),st=NotationRenderer.createStave(12,30,w-24);st.addClef(clef).setContext(ctx).draw();const makeKey=n=>{const x=parseNote(n);return x.letter+'/'+x.oct};const addAcc=(sn,n,i=0)=>{const x=parseNote(n);if(x.acc)sn.addModifier(new VF.Accidental(x.acc==='s'?'#':'b'),i)};let ns;if(harmonic){const sn=new VF.StaveNote({clef,keys:notes.map(makeKey),duration:'q'});notes.forEach((n,i)=>addAcc(sn,n,i));ns=[sn]}else{ns=notes.map(n=>{const sn=new VF.StaveNote({clef,keys:[makeKey(n)],duration:'q'});addAcc(sn,n);return sn})}NotationRenderer.formatAndDraw(ctx,st,ns,{auto_beam:false})}catch(e){el.innerHTML='<div class="theory-note" style="padding:40px;text-align:center">谱例暂时无法显示。</div>'}}
function drawDegreeStaff(el){el.innerHTML='';const VF=vf();if(!VF){drawStaff(el,['c4','g4']);return}try{const w=responsiveStaffWidth(el,260,760),r=NotationRenderer.createRenderer(el);r.resize(w,165);const ctx=r.getContext(),st=NotationRenderer.createStave(12,30,w-24);st.addClef('treble').setContext(ctx).draw();const names=['c4','d4','e4','f4','g4'];const ns=names.map((n,i)=>{const x=parseNote(n),sn=new VF.StaveNote({clef:'treble',keys:[x.letter+'/'+x.oct],duration:'q'});if(i>0&&i<4){if(sn.setStyle)sn.setStyle({fillStyle:'#94a3b8',strokeStyle:'#94a3b8'});if(sn.setStemStyle)sn.setStemStyle({strokeStyle:'transparent',fillStyle:'transparent'});if(sn.setFlagStyle)sn.setFlagStyle({strokeStyle:'transparent',fillStyle:'transparent'})}const an=new VF.Annotation(String(i+1)).setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM);if(an.setFont)an.setFont('Arial',16,'bold');sn.addModifier(an,0);return sn});NotationRenderer.formatAndDraw(ctx,st,ns,{auto_beam:false});}catch(e){drawStaff(el,['c4','g4'])}}

function drawUnisonMeasures(el,{accidentals=false}={}){
  el.innerHTML=''; const VF=vf(); if(!VF)return;
  try{
    const w=responsiveStaffWidth(el,260,760), r=NotationRenderer.createRenderer(el);
    r.resize(w,176); const ctx=r.getContext();
    const groups=w<380?[['f4','f4'],['g4','g4']]:[['f4','f4'],['g4','g4'],['a4','a4']];
    const st=NotationRenderer.createStave(8,38,w-16);
    st.addClef('treble').setContext(ctx).draw();
    const tickables=[];
    groups.forEach((pair,gi)=>{
      pair.forEach((n,ni)=>{
        const x=parseNote(n);
        const sn=new VF.StaveNote({clef:'treble',keys:[x.letter+'/'+x.oct],duration:'w'});
        if(accidentals && ni===1)sn.addModifier(new VF.Accidental('#'),0);
        tickables.push(sn);
      });
      if(gi<groups.length-1)tickables.push(new VF.BarNote());
    });
    const voice=new VF.Voice({num_beats:groups.length*8,beat_value:4}).setMode(VF.Voice.Mode.SOFT).addTickables(tickables);
    NotationRenderer.createFormatter().joinVoices([voice]).formatToStave([voice],st,{align_rests:false});
    voice.draw(ctx,st);
  }catch(e){ el.innerHTML='<div class="theory-note" style="padding:40px;text-align:center">谱例暂时无法显示。</div>'; }
}
function drawSecondMeasures(el){
  el.innerHTML=''; const VF=vf(); if(!VF)return;
  try{
    const w=responsiveStaffWidth(el,260,760), r=NotationRenderer.createRenderer(el);
    r.resize(w,176); const ctx=r.getContext();
    const groups=w<380?[['f4','g4'],['g4','a4']]:[['f4','g4'],['g4','a4'],['a4','b4']];
    const st=NotationRenderer.createStave(8,38,w-16);
    st.addClef('treble').setContext(ctx).draw();
    const tickables=[];
    groups.forEach((pair,gi)=>{
      pair.forEach(n=>{
        const x=parseNote(n);
        tickables.push(new VF.StaveNote({clef:'treble',keys:[x.letter+'/'+x.oct],duration:'w'}));
      });
      if(gi<groups.length-1)tickables.push(new VF.BarNote());
    });
    const voice=new VF.Voice({num_beats:groups.length*8,beat_value:4}).setMode(VF.Voice.Mode.SOFT).addTickables(tickables);
    NotationRenderer.createFormatter().joinVoices([voice]).formatToStave([voice],st,{align_rests:false});
    voice.draw(ctx,st);
  }catch(e){ el.innerHTML='<div class="theory-note" style="padding:40px;text-align:center">谱例暂时无法显示。</div>'; }
}
function drawIntervalOverview(el){
  el.innerHTML=''; const VF=vf(); if(!VF)return;
  try{
    const w=responsiveStaffWidth(el,260,760), r=NotationRenderer.createRenderer(el);
    r.resize(w,176); const ctx=r.getContext(), st=NotationRenderer.createStave(8,38,w-16);
    st.addClef('treble').setContext(ctx).draw();
    const uppers=['f4','g4','a4','b4','c5','d5','e5','f5'];
    const labels=['uni.','2nd','3rd','4th','5th','6th','7th','oct.'];
    const notes=uppers.map((u,i)=>{
      const ux=parseNote(u);
      const sn=new VF.StaveNote({clef:'treble',keys:['f/4',ux.letter+'/'+ux.oct],duration:'w'});
      const an=new VF.Annotation(labels[i]).setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM);
      if(an.setFont)an.setFont('Arial',w<380?10:(w<500?12:14),'bold');
      sn.addModifier(an,0); return sn;
    });
    const voice=new VF.Voice({num_beats:32,beat_value:4}).setMode(VF.Voice.Mode.SOFT).addTickables(notes);
    NotationRenderer.createFormatter().joinVoices([voice]).formatToStave([voice],st,{align_rests:false});
    voice.draw(ctx,st);
  }catch(e){ el.innerHTML='<div class="theory-note" style="padding:40px;text-align:center">谱例暂时无法显示。</div>'; }
}

function makeLeader(container,x1,y1,x2,y2){
  const line=document.createElement('div'); line.className='melodic-leader';
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;
  line.style.left=x1+'px'; line.style.top=y1+'px'; line.style.width=len+'px'; line.style.transform=`rotate(${ang}deg)`;
  container.appendChild(line);
}
function drawMelodicBoard(el,mode='ascending'){
  el.innerHTML=''; const VF=vf(); if(!VF)return;
  try{
    const w=responsiveStaffWidth(el,260,760), r=NotationRenderer.createRenderer(el);
    r.resize(w,176); const ctx=r.getContext(), st=NotationRenderer.createStave(8,38,w-16);
    st.addClef('treble').addTimeSignature('4/4').setContext(ctx).draw();
    let notes;
    if(mode==='ascending'){
      notes=[
        new VF.StaveNote({clef:'treble',keys:['c/5'],duration:'h',stem_direction:-1}),
        new VF.StaveNote({clef:'treble',keys:['d/5'],duration:'h',stem_direction:-1})
      ];
    }else{
      notes=[
        new VF.StaveNote({clef:'treble',keys:['c/5'],duration:'q',stem_direction:-1}),
        new VF.StaveNote({clef:'treble',keys:['d/5'],duration:'q',stem_direction:-1}),
        new VF.StaveNote({clef:'treble',keys:['g/4'],duration:'h',stem_direction:1})
      ];
    }
    const voice=new VF.Voice({num_beats:4,beat_value:4}).addTickables(notes);
    NotationRenderer.createFormatter().joinVoices([voice]).formatToStave([voice],st,{align_rests:false});
    voice.draw(ctx,st);
    if(mode==='both'){
      const align=()=>{
        const wrap=el.closest('.melodic-board-wrap'); if(!wrap)return;
        wrap.querySelectorAll('.melodic-callout,.melodic-leader').forEach(n=>n.remove());
        const svg=el.querySelector('svg'), sr=svg?.getBoundingClientRect(), wr=wrap.getBoundingClientRect();
        if(!sr)return;
        const centers=notes.map(n=>{
          const bb=n.getBoundingBox?.();
          if(bb){const point=new DOMPoint(bb.getX()+bb.getW()/2,bb.getY()+bb.getH()/2).matrixTransform(svg.getScreenCTM());return {x:point.x-wr.left,y:point.y-wr.top};}
          return {x:wr.width/2,y:wr.height/2};
        });
        const upX=(centers[0].x+centers[1].x)/2, downX=(centers[1].x+centers[2].x)/2, labelY=10;
        [['上行',upX],['下行',downX]].forEach(([t,x])=>{
          const lab=document.createElement('div'); lab.className='melodic-callout'; lab.textContent=t; lab.style.left=x+'px'; wrap.appendChild(lab);
        });
        makeLeader(wrap,centers[0].x,centers[0].y-5,upX,labelY+22);
        makeLeader(wrap,centers[1].x,centers[1].y-5,upX,labelY+22);
        makeLeader(wrap,centers[1].x,centers[1].y+3,downX,labelY+22);
        makeLeader(wrap,centers[2].x,centers[2].y-5,downX,labelY+22);
      };
      el.dataset.theoryLayout='';
      el.addEventListener('theory-board-layout',align);
      requestAnimationFrame(align);
    }
  }catch(e){ el.innerHTML='<div class="theory-note" style="padding:40px;text-align:center">谱例暂时无法显示。</div>'; }
}
function renderMelodicBoard(mode){
  board.innerHTML='<div class="melodic-board-wrap"><div class="melodic-board"><div id="melodicStaff" style="width:100%;height:100%"></div></div></div>';
  board.querySelector('.melodic-board-wrap').classList.toggle('with-callouts',mode==='both');
  drawMelodicBoard($('#melodicStaff'),mode);
}


function drawHarmonicBoard(el){
  el.innerHTML=''; const VF=vf(); if(!VF)return;
  try{
    const w=responsiveStaffWidth(el,260,760), r=NotationRenderer.createRenderer(el);
    r.resize(w,176); const ctx=r.getContext(), st=NotationRenderer.createStave(8,38,w-16);
    st.addClef('treble').addTimeSignature('4/4').setContext(ctx).draw();

    // Preserve the page-12 melodic positions: C5, D5, G4.
    // Page 13 only changes C5/D5 stems upward and adds E4/F4 beneath them.
    const c5=new VF.StaveNote({clef:'treble',keys:['c/5'],duration:'q',stem_direction:1});
    const d5=new VF.StaveNote({clef:'treble',keys:['d/5'],duration:'q',stem_direction:1});
    const g4=new VF.StaveNote({clef:'treble',keys:['g/4'],duration:'h',stem_direction:1});
    const e4=new VF.StaveNote({clef:'treble',keys:['e/4'],duration:'h',stem_direction:-1});
    const f4=new VF.StaveNote({clef:'treble',keys:['f/4'],duration:'h',stem_direction:-1});

    const upper=new VF.Voice({num_beats:4,beat_value:4}).addTickables([c5,d5,g4]);
    const lower=new VF.Voice({num_beats:4,beat_value:4}).addTickables([e4,f4]);
    NotationRenderer.createFormatter().joinVoices([upper,lower]).formatToStave([upper,lower],st,{align_rests:false});
    upper.draw(ctx,st); lower.draw(ctx,st);
  }catch(e){el.innerHTML='<div class="theory-note" style="padding:40px;text-align:center">谱例暂时无法显示。</div>'}
}
function renderHarmonicBoard(){
  board.innerHTML='<div class="melodic-board"><div id="harmonicStaff" style="width:100%;height:100%"></div></div>';
  drawHarmonicBoard($('#harmonicStaff'));
}

function renderCompactKeyboard(active=[]){
  const naturals=['C4','D4','E4','F4','G4','A4','B4','C5','D5','E5','F5','G5','A5','B5','C6'];
  const blackAfter={C4:'C#4',D4:'D#4',F4:'F#4',G4:'G#4',A4:'A#4',C5:'C#5',D5:'D#5',F5:'F#5',G5:'G#5',A5:'A#5'};
  board.innerHTML='<div class="compact-keyboard-scroll"><div class="compact-keyboard" id="compactKeyboard"></div></div>';
  const kb=$('#compactKeyboard');
  naturals.forEach((n,i)=>{
    const k=document.createElement('div'); k.className='white-key'+(active.includes(n)?' active':'');
    k.innerHTML=`<span class="key-label">${n.replace(/[45]/,'')}</span>`; kb.appendChild(k);
    const sharp=blackAfter[n];
    if(sharp){
      const b=document.createElement('div'); b.className='black-key'+(active.includes(sharp)?' active':'');
      b.style.left=(8+(i+1)*29)+'px'; kb.appendChild(b);
    }
  });
  requestAnimationFrame(()=>{
    const scroll=board.querySelector('.compact-keyboard-scroll');
    const first=kb.querySelector('.active');
    if(scroll&&first) scroll.scrollLeft=Math.max(0,first.offsetLeft-scroll.clientWidth*.28);
  });
}
function drawToneCountStaff(el){
  el.innerHTML=''; const VF=vf(); if(!VF)return;
  try{
    const w=responsiveStaffWidth(el,260,760), r=NotationRenderer.createRenderer(el);
    r.resize(w,176); const ctx=r.getContext();
    const groups=[
      {upper:'e/4',acc:null,label:'2'},
      {upper:'e/4',acc:'b',label:'1.5'},
      {upper:'e/4',acc:'#',label:'2.5'}
    ];

function drawEnharmonicToneStaff(el){
  el.innerHTML=''; const VF=vf(); if(!VF)return;
  try{
    const w=responsiveStaffWidth(el,220,760),h=176;
    const r=NotationRenderer.createRenderer(el); r.resize(w,h);
    const ctx=r.getContext(),left=8,right=8,staffW=w-left-right,staveY=38;
    const st=NotationRenderer.createStave(left,staveY,staffW);
    st.addClef('treble').setContext(ctx).draw();

    const svg=el.querySelector('svg'),ns='http://www.w3.org/2000/svg';

    const n1=new VF.StaveNote({clef:'treble',keys:['c/4','f/4'],duration:'w'});
    n1.addModifier(new VF.Accidental('#'),1);
    const n2=new VF.StaveNote({clef:'treble',keys:['c/4','g/4'],duration:'w'});
    n2.addModifier(new VF.Accidental('b'),1);

    const voice=new VF.Voice({num_beats:8,beat_value:4}).addTickables([n1,n2]);

    // Snapshot the SVG before the notes are drawn. This lets us inspect only
    // the final SVG geometry created by the notation pass.
    const before=new Set([...svg.querySelectorAll('*')]);
    NotationRenderer.createFormatter().joinVoices([voice]).formatToStave([voice],st);
    voice.draw(ctx,st);
    const created=[...svg.querySelectorAll('*')].filter(node=>!before.has(node));

    // Equal geometric measures.
    const dividerX=left+staffW/2;
    const bar=document.createElementNS(ns,'line');
    bar.setAttribute('x1',dividerX);bar.setAttribute('x2',dividerX);
    bar.setAttribute('y1',st.getYForLine(0));bar.setAttribute('y2',st.getYForLine(4));
    bar.setAttribute('stroke','#111');bar.setAttribute('stroke-width','1');
    svg.appendChild(bar);

    /*
      Find the ACTUAL rendered whole-note notehead paths.

      We deliberately do not use:
        - TickContext X
        - StaveNote.getAbsoluteX()
        - NoteHead.getAbsoluteX()
        - the bounding box of the whole note+accidental group

      Instead we inspect final SVG paths and identify the four whole-note heads
      by their compact glyph geometry and their Y positions on this stave.
      Accidentals are taller/narrower glyphs and are excluded by geometry.
    */
    const expectedYs=[
      st.getYForNote(0), // retained only as a stave-relative reference
    ];

    const candidates=[];
    created.forEach(node=>{
      if(!(node instanceof SVGGraphicsElement)) return;
      if(node.tagName.toLowerCase()!=='path') return;
      try{
        const b=node.getBBox();
        // Whole-note heads are compact horizontal glyphs. Keep generous limits
        // for VexFlow/font/browser variation, while excluding accidentals/stems.
        if(b.width>=8 && b.width<=26 && b.height>=5 && b.height<=18){
          candidates.push({
            node,b,
            cx:b.x+b.width/2,
            cy:b.y+b.height/2
          });
        }
      }catch(_){}
    });

    // Group candidate noteheads by horizontal location. Each harmonic interval
    // contributes two heads at essentially the same X. The accidental paths do
    // not form such a two-head vertical pair.
    candidates.sort((a,b)=>a.cx-b.cx);
    const clusters=[];
    candidates.forEach(c=>{
      let cluster=clusters.find(g=>Math.abs(g.x-c.cx)<4);
      if(!cluster){
        cluster={x:c.cx,items:[]};
        clusters.push(cluster);
      }
      cluster.items.push(c);
      cluster.x=cluster.items.reduce((s,v)=>s+v.cx,0)/cluster.items.length;
    });

    // A chord cluster must contain at least two vertically distinct compact
    // notehead glyphs. Choose the two notation clusters from left to right.
    const chordClusters=clusters.filter(g=>{
      if(g.items.length<2)return false;
      const ys=g.items.map(v=>v.cy);
      return Math.max(...ys)-Math.min(...ys)>8;
    }).sort((a,b)=>a.x-b.x).slice(0,2);

    let x1=chordClusters[0]?.x ?? null;
    let x2=chordClusters[1]?.x ?? null;

    // Conservative fallback: if SVG glyph detection changes in a future
    // VexFlow build, fall back to the notehead API rather than losing labels.
    function fallbackX(note){
      try{
        const heads=note.getNoteHeads?note.getNoteHeads():[];
        if(heads.length){
          const h=heads[0];
          const x=typeof h.getAbsoluteX==='function'?h.getAbsoluteX():
                  (typeof h.getX==='function'?h.getX():NaN);
          if(Number.isFinite(x))return x;
        }
      }catch(_){}
      return null;
    }
    if(!Number.isFinite(x1))x1=fallbackX(n1);
    if(!Number.isFinite(x2))x2=fallbackX(n2);

    const add=(txt,x,y,size=11)=>{
      if(!Number.isFinite(x))return;
      const t=document.createElementNS(ns,'text');
      t.setAttribute('x',x);t.setAttribute('y',y);
      t.setAttribute('text-anchor','middle');
      t.setAttribute('font-family','Arial,sans-serif');
      t.setAttribute('font-size',size);t.setAttribute('font-weight','700');
      t.setAttribute('fill','#6e6e73');t.textContent=txt;svg.appendChild(t);
    };

    // Text follows the final visible notehead centres.
    add('4th',x1,25,w<360?9:11);
    add('5th',x2,25,w<360?9:11);
    add('3',x1,160,w<360?10:12);
    add('3',x2,160,w<360?10:12);

    const label=document.createElementNS(ns,'text');
    label.setAttribute('x',Math.max(12,left+6));label.setAttribute('y','160');
    label.setAttribute('font-family','PingFang SC,Arial,sans-serif');
    label.setAttribute('font-size',w<360?'9':'11');
    label.setAttribute('font-weight','700');label.setAttribute('fill','#6e6e73');
    label.textContent='音数';svg.appendChild(label);
  }catch(e){
    console.error('Page 21 SVG-notehead render failed:',e);
    el.innerHTML='<div class="theory-note" style="padding:40px;text-align:center">谱例暂时无法显示。</div>';
  }
}

/* ===== Lesson example audio =====
   Human-facing page numbers (1-based).
   Audio is created on demand; the lesson does not preload every MP3.
*/
const LESSON_AUDIO={
  1:{file:'assets/audio/01.mp3'},2:{file:'assets/audio/01.mp3'},3:{file:'assets/audio/01.mp3'},
  4:{file:'assets/audio/q1.mp3',auto:true},5:{file:'assets/audio/q2.mp3',auto:true},
  6:{file:'assets/audio/02.mp3'},7:{file:'assets/audio/02.mp3'},
  8:{file:'assets/audio/q3.mp3',auto:true},9:{file:'assets/audio/q4.mp3',auto:true},
  10:{file:'assets/audio/03.mp3'},11:{file:'assets/audio/03.mp3'},
  12:{file:'assets/audio/04.mp3'},13:{file:'assets/audio/04.mp3'},14:{file:'assets/audio/04.mp3'},
  17:{file:'assets/audio/05.mp3'},18:{file:'assets/audio/06.mp3'}
};

let lessonAudio=null,lessonAudioPage=null,audioNavigationToken=0;

function stopLessonAudio(){
  if(lessonAudio){
    try{lessonAudio.pause();lessonAudio.currentTime=0}catch(_){}
  }
  lessonAudio=null;lessonAudioPage=null;
  document.querySelector('.lesson-audio-btn')?.classList.remove('playing');
}
function playLessonAudio(pageNumber){
  const spec=LESSON_AUDIO[pageNumber]; if(!spec)return;
  if(!lessonAudio||lessonAudioPage!==pageNumber){
    stopLessonAudio();
    lessonAudio=new Audio(spec.file);
    lessonAudio.preload='metadata';
    lessonAudioPage=pageNumber;
    lessonAudio.addEventListener('ended',()=>document.querySelector('.lesson-audio-btn')?.classList.remove('playing'));
  }else{
    try{lessonAudio.pause();lessonAudio.currentTime=0}catch(_){}
  }
  const btn=document.querySelector('.lesson-audio-btn');
  btn?.classList.add('playing');
  const p=lessonAudio.play();
  if(p&&typeof p.catch==='function')p.catch(err=>{
    btn?.classList.remove('playing');
    console.warn('Lesson audio playback failed or was blocked:',spec.file,err);
  });
}
function installLessonAudio(pageNumber){
  const boardEl=document.getElementById('lessonBoard'),spec=LESSON_AUDIO[pageNumber];
  boardEl?.querySelectorAll('.lesson-audio-btn').forEach(btn=>btn.remove());
  if(!boardEl||!spec)return;
  const btn=document.createElement('button');
  btn.type='button';btn.className='lesson-audio-btn';btn.setAttribute('aria-label','播放谱例');btn.title='播放谱例';
  btn.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zm0-8.5v2.06A7 7 0 0 1 20 12a7 7 0 0 1-3.5 6.44v2.06A9 9 0 0 0 22 12a9 9 0 0 0-5.5-8.5z"/></svg>';
  boardEl.appendChild(btn);
  boardEl.dataset.audioPage=String(pageNumber);
  boardEl.onclick=e=>{
    e.preventDefault();
    if(Number(boardEl.dataset.audioPage)!==current+1)return;
    playLessonAudio(pageNumber);
  };
  btn.onclick=e=>{
    e.preventDefault();e.stopPropagation();
    if(Number(boardEl.dataset.audioPage)!==current+1)return;
    playLessonAudio(pageNumber);
  };
}
function refreshLessonAudioForPage(pageIndex,autoplay=true){
  const pageNumber=pageIndex+1,token=++audioNavigationToken;
  const nextSpec=LESSON_AUDIO[pageNumber];
  const currentFile=lessonAudio?.getAttribute('src') || null;
  const sameFile=!!(nextSpec?.file && currentFile===nextSpec.file);

  // Only stop playback when the destination page uses a different audio file,
  // or explicitly has no audio (page 15). Shared-audio page groups continue
  // playing seamlessly across page changes.
  if(!sameFile) stopLessonAudio();

  requestAnimationFrame(()=>{
    if(token!==audioNavigationToken||current!==pageIndex)return;
    installLessonAudio(pageNumber);

    // Auto-play only when entering a genuinely new audio file.
    // Moving inside a shared-audio group must not restart an existing recording.
    if(autoplay && nextSpec?.auto && !sameFile) playLessonAudio(pageNumber);
  });
}

    const svg=el.querySelector('svg'),ns=[...svg.querySelectorAll('.vf-stavenote')],

function renderL2QuizStaff(note1,note2){
  board.innerHTML='<div class="lesson02-second-board"><div id="l2QuizStaff" style="width:100%;height:100%"></div></div>';
  const el=document.getElementById('l2QuizStaff'),VF=vf(); if(!VF)return;
  try{
    const parse=(n)=>{
      const m=n.match(/^([A-Ga-g])([#b]?)(\d)$/);
      return {key:m[1].toLowerCase()+'/'+m[3],acc:m[2]||null};
    };
    const a=parse(note1),b=parse(note2);
    const w=responsiveStaffWidth(el,280,760),r=NotationRenderer.createRenderer(el);
    r.resize(w,176);const ctx=r.getContext(),st=NotationRenderer.createStave(12,38,w-24);
    st.addClef('treble').setContext(ctx).draw();
    const mk=(n)=>{const x=new VF.StaveNote({clef:'treble',keys:[n.key],duration:'h'});if(n.acc)x.addModifier(new VF.Accidental(n.acc),0);return x};
    const voice=new VF.Voice({num_beats:4,beat_value:4}).addTickables([mk(a),mk(b)]);
    NotationRenderer.createFormatter().joinVoices([voice]).formatToStave([voice],st,{align_rests:false});
    voice.draw(ctx,st);
  }catch(e){el.innerHTML='<div class="theory-note" style="padding:40px;text-align:center">谱例暂时无法显示。</div>'}
}

function l2QualityQuiz(q,ans){
  const pageIndex=current;
  const labels={P:'纯',A:'增',d:'减'};
  const saved=quizAnswers.get(pageIndex);
  body.innerHTML=`<div class="quiz-block"><div class="quiz-kicker">QUIZ</div><div class="quiz-question">${q}</div>
    <div class="quiz-options vertical">${['P','A','d'].map(v=>`<button class="quiz-option ${saved===v?(saved===ans?'correct':'wrong'):''}" data-a="${v}">${labels[v]}</button>`).join('')}</div>
    <div class="feedback ${saved?(saved===ans?'ok':'bad'):''}">${saved?(saved===ans?'正确':'再想一想'):''}</div></div>`;
  const block=body.querySelector('.quiz-block'),options=[...block.querySelectorAll('.quiz-option')],feedback=block.querySelector('.feedback');
  options.forEach(btn=>btn.onclick=()=>{
    if(passedQuizzes.has(pageIndex))return;
    const ok=btn.dataset.a===ans;
    quizAnswers.set(pageIndex,btn.dataset.a);
    options.forEach(x=>x.classList.remove('correct','wrong'));
    btn.classList.add(ok?'correct':'wrong');
    feedback.textContent=ok?'正确':'再想一想';
    feedback.className='feedback '+(ok?'ok':'bad');
    if(ok){passedQuizzes.add(pageIndex);setQuizContinueEnabled(true)}else setQuizContinueEnabled(false);
  });
  setQuizContinueEnabled(passedQuizzes.has(pageIndex));
}

const lessonView=TheoryLesson.create({board,explanation:body,viewport:$('#stepBody')});
TheoryLesson.progress(0,steps.length,'教学步骤');
updateHeaderLessonCount(-1);
board.addEventListener('theory-board-layout',alignBoardRoleLabels);
function highlightKeys(ns){document.querySelectorAll('#kb [data-note]').forEach(k=>k.classList.toggle('on',ns.includes(k.dataset.note)))}
function showStep(i,doScroll=true){
  const previous=current;
  $('#siteFooter').style.display='';
  current=i;
  document.body.classList.add('lesson-active','theory-active');
  home.classList.add('hidden');
  summary.classList.add('hidden');
  lesson.classList.remove('hidden');
  TheoryLesson.progress(i+1,steps.length,'教学步骤');
  $('#prevBtn').textContent=i===0?'返回首页':'← 上一步';
  const isMultiQuiz=[23,24,25].includes(i);
  $('#nextBtn').textContent=isMultiQuiz&&!passedQuizzes.has(i)?'确认':(i===steps.length-1?'完成学习':'继续 →');
  setQuizContinueEnabled(isMultiQuiz || ![3,4,7,8,14,15].includes(i) || passedQuizzes.has(i));
  const view=lessonView.show(steps[i],{forward:doScroll && i>previous});
  if(isMultiQuiz){
    setQuizContinueEnabled(true);
    $('#nextBtn').textContent=passedQuizzes.has(i)?(i===steps.length-1?'完成学习':'继续 →'):'确认';
  }
  refreshLessonAudioForPage(i,doScroll && i>previous && !view.restored);
  updateHeaderLessonCount(i);

}




$('#startLearning').onclick=startLesson;
$('#prevBtn').onclick=()=>{if(current===0)goHome();else showStep(current-1)};
$('#nextBtn').onclick=e=>{
  const btn=$('#nextBtn');
  if(btn.disabled || btn.getAttribute('aria-disabled')==='true'){
    e?.preventDefault();
    e?.stopPropagation();
    return;
  }
  if([23,24,25].includes(current) && !passedQuizzes.has(current)){
    confirmL2MultiQuiz();
    return;
  }
  if(current<steps.length-1)showStep(current+1);
  else showSummary();
};
$('#backHome').onclick=goHome;
function goHome(){current=0;document.body.classList.remove('lesson-active','theory-active');lessonView.leave();clearBoard();lesson.classList.add('hidden');summary.classList.add('hidden');home.classList.remove('hidden');$('#siteFooter').style.display='';TheoryLesson.progress(0,steps.length,'教学步骤');updateHeaderLessonCount(-1);window.scrollTo({top:0,behavior:'instant'})}
function showSummary(){document.body.classList.remove('lesson-active','theory-active');lessonView.leave();clearBoard();lesson.classList.add('hidden');home.classList.add('hidden');summary.classList.remove('hidden');$('#siteFooter').style.display='';TheoryLesson.progress(steps.length,steps.length,'教学步骤');window.scrollTo({top:0,behavior:'instant'})}
// Shared display runtime preserves diagram and check state across navigation.

(function(){
  let lastTouchEnd=0;
  document.addEventListener('touchend',function(e){
    if(e.touches && e.touches.length>0) return;
    const now=Date.now();
    if(now-lastTouchEnd<=300){
      e.preventDefault();
    }
    lastTouchEnd=now;
  },{passive:false});
})();
