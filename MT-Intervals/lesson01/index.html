/* Fixed lesson workspace: header / blackboard / scrollable text / controls */
body.lesson-active{height:100dvh;overflow:hidden;padding-bottom:10px}
body.lesson-active .app{height:calc(100dvh - 20px);min-height:0}
body.lesson-active header{flex:0 0 auto;margin-bottom:10px}
body.lesson-active main{flex:1;min-height:0;display:flex;flex-direction:column}
body.lesson-active #lesson{flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:0;margin-bottom:8px;overflow:hidden}
body.lesson-active #lesson.hidden{display:none!important}
.lesson-board{flex:0 0 auto;position:relative;min-height:0}
.lesson-board:empty{display:none}
.lesson-board .intro-stage{margin:0}
.lesson-board .staff{min-height:145px}
.lesson-content{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 2px 18px;scroll-behavior:smooth}
body.lesson-active .lesson .nav{position:static;left:auto;bottom:auto;transform:none;flex:0 0 auto;width:auto;margin:8px 0 0;padding:10px 0 0;background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none;border-top:1px solid var(--border);border-radius:0}

.board-role-wrap{position:relative}.board-role-wrap .staff{background:#fff}
.board-note-role{position:absolute;top:8px;z-index:3;font-size:.78rem;font-weight:900;color:var(--primary);opacity:0;transform:translate(-50%,10px);transition:opacity .55s ease,transform .55s ease;pointer-events:none;white-space:nowrap}

.degree-note-names .endpoint{font-size:1.08rem;font-weight:900;color:var(--text)}
.degree-note-names .middle{font-size:.84rem;font-weight:650;color:#94a3b8}

/* Stable lesson frame v3 */
body.lesson-active #lesson{padding:20px 24px;margin-bottom:10px}
body.lesson-active .lesson-board{height:178px;min-height:178px;max-height:178px;flex:0 0 178px;overflow:hidden;margin:0}

body.lesson-active .lesson-content{padding:16px 2px 12px;overscroll-behavior:contain}
.lesson-footer-zone{display:none}

.lesson-footer-zone .nav{display:flex;gap:10px;margin:0 0 6px}
.lesson-footer-zone .nav>*{flex:1}

.lesson-paragraph{font-size:1.12rem;line-height:2.08;color:#475569;margin:0}
.lesson-paragraph + .lesson-paragraph{margin-top:1.25em}
.lesson-paragraph strong{font-weight:900;color:var(--text)}
@media(max-width:400px){.card{padding:20px 17px}.pattern-cards{grid-template-columns:1fr}.degree-grid{grid-template-columns:repeat(4,1fr)}.summary-list{grid-template-columns:1fr}.direction-grid{grid-template-columns:1fr}.two-col{grid-template-columns:1fr}}

/* Degree sequence boards */
.degree-sequence-board{height:100%;display:flex;align-items:center;justify-content:center;padding:0 6px}
.degree-sequence-board svg{display:block;width:100%;height:100%}
.degree-list-board{height:100%;display:flex;align-items:center;justify-content:center;padding:0 2px}
.degree-list-board svg{display:block;width:100%;height:100%}

/* Melodic interval boards */
.melodic-board{height:100%;display:flex;align-items:center;justify-content:center;padding:0 6px}
.melodic-board svg{display:block;width:100%;height:100%}
.melodic-board-wrap{position:relative;width:100%;height:100%}
.melodic-callout{position:absolute;top:8px;transform:translateX(-50%);font-size:15px;font-weight:750;color:var(--accent);letter-spacing:.04em;pointer-events:none}
.melodic-leader{position:absolute;height:1.5px;background:var(--accent);transform-origin:0 50%;pointer-events:none;opacity:.85}

/* Inline lesson quiz */
.quiz-block{margin-top:30px;padding-top:24px;border-top:1px solid var(--border)}
.quiz-kicker{font-family:Arial,sans-serif;font-size:14px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.quiz-question{font-size:20px;line-height:1.85;font-weight:650;margin-bottom:16px}
.quiz-options{display:flex;gap:12px;flex-wrap:wrap}
.quiz-option{appearance:none;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:999px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer;transition:.18s ease;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.quiz-option.correct{border-color:#34c759;background:#edf9f0;color:#218739}
.quiz-option.wrong{border-color:#ff3b30;background:#fff0ef;color:#c92a22}

/* Stable frame fixes v4 */
body.lesson-active{overflow:hidden;padding-top:10px;padding-bottom:10px}
body.lesson-active header{display:block!important;visibility:visible!important;opacity:1!important;position:relative;z-index:20}
body.lesson-active .lesson-board{border:1px solid var(--border);border-radius:12px;background:#fff}
body.lesson-active .lesson-board .staff{border:0;border-radius:11px}
body.lesson-active .lesson-board .intro-stage{height:100%}
body.lesson-active .lesson-board .board-role-wrap{height:100%}
.lesson-footer-zone button,.lesson-footer-zone .primary,.lesson-footer-zone .ghost{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.lesson-footer-zone{touch-action:manipulation}

.lesson-top{display:flex;align-items:center;justify-content:space-between;gap:14px;min-width:0}
.lesson-top .brand{min-width:0;white-space:nowrap}
.lesson-meta{display:flex;align-items:center;justify-content:flex-end;gap:.5ch;min-width:0;white-space:nowrap}
.lesson-meta .lesson-count{font-size:12px;font-weight:750;color:var(--muted);letter-spacing:.04em}
.lesson-meta .lesson-id{font-size:12px;font-weight:800;letter-spacing:.08em}
#lessonStep{display:none!important}
.lesson-body{scroll-behavior:smooth;overscroll-behavior:contain}
.board{overflow:hidden}
.board svg{max-width:100%;height:auto}
@media(max-width:520px){

}

.lesson-shell,.lesson-view{max-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom))}

#lessonStep,.lesson-step,.step-indicator,.page-indicator,.lesson-progress-text{display:none!important}
#headerLessonCount{display:inline!important}


/* Compact two-octave keyboard for pages 15–18 */
.compact-keyboard-scroll{width:100%;height:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;display:flex;align-items:center}

.tone-count-board{height:100%;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tone-count-board svg{display:block;width:100%;height:100%}

   which overrode body{padding-top:env(safe-area-inset-top)} by specificity. */

  min-height:100dvh;
  padding-left:max(10px,env(safe-area-inset-left));
  padding-right:max(10px,env(safe-area-inset-right));
}

  height:100dvh;
  min-height:100dvh;
  overflow:hidden;
  padding-top:max(10px,env(safe-area-inset-top))!important;
  padding-bottom:max(10px,env(safe-area-inset-bottom))!important;
}

  height:calc(100dvh - max(10px,env(safe-area-inset-top)) - max(10px,env(safe-area-inset-bottom)))!important;
  min-height:0;
}
body.lesson-active header{
  position:relative!important;

<script>
const $=s=>document.querySelector(s); const home=$('#home'),lesson=$('#lesson'),summary=$('#summary'),body=$('#stepBody'),board=$('#lessonBoard');
let current=0, audioCtx=null;
const learningState={q2:null,q3:null,q4:null,flat4:false,degree5:0,odd5:'ll',even5:'ls',build6:null,mode7:'up',example8:null,pitch8:null,example9a:'e4',example9b:'fs4'};
const noteFreq={c4:261.626,cs4:277.183,d4:293.665,ds4:311.127,e4:329.628,f4:349.228,fs4:369.994,g4:391.995,gs4:415.305,a4:440,as4:466.164,b4:493.883,c5:523.251,d5:587.33,e5:659.255,f5:698.456,g5:783.991};
const chromatic=['c4','cs4','d4','ds4','e4','f4','fs4','g4','gs4','a4','as4','b4','c5'];
const degreeNotes=['c4','d4','e4','f4','g4','a4','b4','c5']; const degreeCN=['一度','二度','三度','四度','五度','六度','七度','八度'];
function ac(){if(!audioCtx||audioCtx.state==='closed') audioCtx=new (window.AudioContext||window.webkitAudioContext)();return audioCtx}
function wakeAudio(){const c=ac();if(c.state==='suspended')c.resume().catch(()=>{});return c}
function synth(note,d=.72,when=0){const c=wakeAudio(),t=c.currentTime+when,f=noteFreq[note]||noteFreq[note.replace('eb','ds').replace('gb','fs')]||440;const master=c.createGain();master.gain.setValueAtTime(.0001,t);master.gain.exponentialRampToValueAtTime(.20,t+.006);master.gain.exponentialRampToValueAtTime(.065,t+.09);master.gain.exponentialRampToValueAtTime(.0001,t+d);master.connect(c.destination);[[1,'triangle',1],[2,'sine',.13],[3,'sine',.045]].forEach(([m,type,level])=>{const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f*m,t);g.gain.value=level;o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03)})}
function play(note,d=.72,delay=0){wakeAudio();synth(note,d,delay)}
function playSeq(a,b){wakeAudio();synth(a,.58,0);synth(b,.58,.64)}
function playTogether(a,b){wakeAudio();synth(a,.82,0);synth(b,.82,0)}
function semitonePath(a,b){let ia=chromatic.indexOf(a),ib=chromatic.indexOf(b);if(ia<0||ib<0)return [];if(ia>ib)[ia,ib]=[ib,ia];return chromatic.slice(ia,ib+1)}
function semitoneCount(a,b){const p=semitonePath(a,b);return Math.max(0,p.length-1)}
function vf(){return window.Vex&&window.Vex.Flow?window.Vex.Flow:window.VexFlow}
function parseNote(n){const m=n.match(/^([a-g])(s|b)?(\d)$/);return {letter:m[1],acc:m[2]||'',oct:m[3]}}
function drawStaff(el,notes,{clef='treble',harmonic=false}={}){el.innerHTML='';const VF=vf();if(!VF){el.innerHTML='<div class="tiny" style="padding:40px;text-align:center">五线谱组件未载入，请检查网络连接。</div>';return}try{const w=responsiveStaffWidth(el,260,760),r=new VF.Renderer(el,VF.Renderer.Backends.SVG);r.resize(w,140);const ctx=r.getContext(),st=new VF.Stave(12,30,w-24);st.addClef(clef).setContext(ctx).draw();const makeKey=n=>{const x=parseNote(n);return x.letter+'/'+x.oct};const addAcc=(sn,n,i=0)=>{const x=parseNote(n);if(x.acc)sn.addModifier(new VF.Accidental(x.acc==='s'?'#':'b'),i)};let ns;if(harmonic){const sn=new VF.StaveNote({clef,keys:notes.map(makeKey),duration:'q'});notes.forEach((n,i)=>addAcc(sn,n,i));ns=[sn]}else{ns=notes.map(n=>{const sn=new VF.StaveNote({clef,keys:[makeKey(n)],duration:'q'});addAcc(sn,n);return sn})}VF.Formatter.FormatAndDraw(ctx,st,ns,{auto_beam:false})}catch(e){el.innerHTML='<div class="tiny" style="padding:40px;text-align:center">谱例暂时无法显示。</div>'}}
function drawPolyphonicSecond(el){el.innerHTML='';const VF=vf();if(!VF)return;try{const w=Math.max(260,el.clientWidth||300),r=new VF.Renderer(el,VF.Renderer.Backends.SVG);r.resize(w,140);const ctx=r.getContext(),st=new VF.Stave(12,30,w-24);st.addClef('treble').setContext(ctx).draw();const upper=new VF.StaveNote({clef:'treble',keys:['d/4'],duration:'q',stem_direction:VF.Stem.UP});const lower=new VF.StaveNote({clef:'treble',keys:['c/4'],duration:'q',stem_direction:VF.Stem.DOWN});const v1=new VF.Voice({num_beats:1,beat_value:4}).addTickables([upper]);const v2=new VF.Voice({num_beats:1,beat_value:4}).addTickables([lower]);new VF.Formatter().joinVoices([v1,v2]).formatToStave([v1,v2],st);v1.draw(ctx,st);v2.draw(ctx,st)}catch(e){drawStaff(el,['c4','d4'],{harmonic:true})}}
function drawDegreeStaff(el){el.innerHTML='';const VF=vf();if(!VF){drawStaff(el,['c4','g4']);return}try{const w=responsiveStaffWidth(el,260,760),r=new VF.Renderer(el,VF.Renderer.Backends.SVG);r.resize(w,165);const ctx=r.getContext(),st=new VF.Stave(12,30,w-24);st.addClef('treble').setContext(ctx).draw();const names=['c4','d4','e4','f4','g4'];const ns=names.map((n,i)=>{const x=parseNote(n),sn=new VF.StaveNote({clef:'treble',keys:[x.letter+'/'+x.oct],duration:'q'});if(i>0&&i<4){if(sn.setStyle)sn.setStyle({fillStyle:'#94a3b8',strokeStyle:'#94a3b8'});if(sn.setStemStyle)sn.setStemStyle({strokeStyle:'transparent',fillStyle:'transparent'});if(sn.setFlagStyle)sn.setFlagStyle({strokeStyle:'transparent',fillStyle:'transparent'})}const an=new VF.Annotation(String(i+1)).setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM);if(an.setFont)an.setFont('Arial',12,'normal');sn.addModifier(an,0);return sn});VF.Formatter.FormatAndDraw(ctx,st,ns,{auto_beam:false});}catch(e){drawStaff(el,['c4','g4'])}}
function qChoices(id,items,correct,ok,bad){return `<div class="choices" id="${id}">${items.map((x,i)=>`<button class="choice" data-i="${i}">${x}</button>`).join('')}</div><div class="feedback" id="${id}fb"></div>`}
function bindChoice(id,correct,ok,bad){const key=id;const apply=i=>{const fb=$('#'+id+'fb');document.querySelectorAll('#'+id+' .choice').forEach(x=>{x.classList.remove('correct','wrong');if(+x.dataset.i===i)x.classList.add(i===correct?'correct':'wrong')});if(i!==null&&i!==undefined){fb.className='feedback '+(i===correct?'ok':'bad');fb.textContent=i===correct?ok:bad}};apply(learningState[key]);document.querySelectorAll('#'+id+' .choice').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;learningState[key]=i;apply(i)})}

}

function drawUnisonMeasures(el,{accidentals=false}={}){
  el.innerHTML=''; const VF=vf(); if(!VF)return;
  try{
    const w=responsiveStaffWidth(el,260,760), r=new VF.Renderer(el,VF.Renderer.Backends.SVG);
    r.resize(w,176); const ctx=r.getContext();
    const groups=w<380?[['f4','f4'],['g4','g4']]:[['f4','f4'],['g4','g4'],['a4','a4']];
    const st=new VF.Stave(8,38,w-16);
    st.addClef('treble').setContext(ctx).draw();
    const tickables=[];
    groups.forEach((pair,gi)=>{
      pair.forEach((n,ni)=>{
        const x=parseNote(n);
        const sn=new VF.StaveNote({clef:'treble',keys:[x.letter+'/'+x.oct],duration:'w'});
        if(accidentals && ni===1)sn.addModifier(new VF.Accidental('#'),0);
        tickables.push(sn);
      });
      if(gi<groups.length-1)tickables.push(new VF.BarNote());
    });
    const voice=new VF.Voice({num_beats:groups.length*8,beat_value:4}).setMode(VF.Voice.Mode.SOFT).addTickables(tickables);
    new VF.Formatter().joinVoices([voice]).formatToStave([voice],st,{align_rests:false});
    voice.draw(ctx,st);
  }catch(e){ el.innerHTML='<div class="tiny" style="padding:40px;text-align:center">谱例暂时无法显示。</div>'; }
}
function drawSecondMeasures(el){
  el.innerHTML=''; const VF=vf(); if(!VF)return;
  try{
    const w=responsiveStaffWidth(el,260,760), r=new VF.Renderer(el,VF.Renderer.Backends.SVG);
    r.resize(w,176); const ctx=r.getContext();
    const groups=w<380?[['f4','g4'],['g4','a4']]:[['f4','g4'],['g4','a4'],['a4','b4']];
    const st=new VF.Stave(8,38,w-16);
    st.addClef('treble').setContext(ctx).draw();
    const tickables=[];
    groups.forEach((pair,gi)=>{
      pair.forEach(n=>{
        const x=parseNote(n);
        tickables.push(new VF.StaveNote({clef:'treble',keys:[x.letter+'/'+x.oct],duration:'w'}));
      });
      if(gi<groups.length-1)tickables.push(new VF.BarNote());
    });
    const voice=new VF.Voice({num_beats:groups.length*8,beat_value:4}).setMode(VF.Voice.Mode.SOFT).addTickables(tickables);
    new VF.Formatter().joinVoices([voice]).formatToStave([voice],st,{align_rests:false});
    voice.draw(ctx,st);
  }catch(e){ el.innerHTML='<div class="tiny" style="padding:40px;text-align:center">谱例暂时无法显示。</div>'; }
}
function drawIntervalOverview(el){
  el.innerHTML=''; const VF=vf(); if(!VF)return;
  try{
    const w=responsiveStaffWidth(el,260,760), r=new VF.Renderer(el,VF.Renderer.Backends.SVG);
    r.resize(w,176); const ctx=r.getContext(), st=new VF.Stave(8,38,w-16);
    st.addClef('treble').setContext(ctx).draw();
    const uppers=['f4','g4','a4','b4','c5','d5','e5','f5'];
    const labels=['uni.','2nd','3rd','4th','5th','6th','7th','oct.'];
    const notes=uppers.map((u,i)=>{
      const ux=parseNote(u);
      const sn=new VF.StaveNote({clef:'treble',keys:['f/4',ux.letter+'/'+ux.oct],duration:'w'});
      const an=new VF.Annotation(labels[i]).setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM);
      if(an.setFont)an.setFont('Arial',w<380?7.5:(w<500?8.5:10),'normal');
      sn.addModifier(an,0); return sn;
    });
    const voice=new VF.Voice({num_beats:32,beat_value:4}).setMode(VF.Voice.Mode.SOFT).addTickables(notes);
    new VF.Formatter().joinVoices([voice]).formatToStave([voice],st,{align_rests:false});
    voice.draw(ctx,st);
  }catch(e){ el.innerHTML='<div class="tiny" style="padding:40px;text-align:center">谱例暂时无法显示。</div>'; }
}
function renderDegreeSequenceBoard(mode){
  board.innerHTML='<div class="degree-sequence-board"><div id="degreeSequenceStaff" style="width:100%;height:100%"></div></div>';
  const el=$('#degreeSequenceStaff');
  if(mode==='unison')drawUnisonMeasures(el);
  else if(mode==='altered-unison')drawUnisonMeasures(el,{accidentals:true});
  else if(mode==='second')drawSecondMeasures(el);

  board.innerHTML='<div class="degree-list-board"><div id="intervalOverviewStaff" style="width:100%;height:100%"></div></div>';
  drawIntervalOverview($('#intervalOverviewStaff'));
}


function makeLeader(container,x1,y1,x2,y2){
  const line=document.createElement('div'); line.className='melodic-leader';
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;
  line.style.left=x1+'px'; line.style.top=y1+'px'; line.style.width=len+'px'; line.style.transform=`rotate(${ang}deg)`;
  container.appendChild(line);
}
function drawMelodicBoard(el,mode='ascending'){
  el.innerHTML=''; const VF=vf(); if(!VF)return;
  try{
    const w=responsiveStaffWidth(el,260,760), r=new VF.Renderer(el,VF.Renderer.Backends.SVG);
    r.resize(w,176); const ctx=r.getContext(), st=new VF.Stave(8,38,w-16);
    st.addClef('treble').addTimeSignature('4/4').setContext(ctx).draw();
    let notes;
    if(mode==='ascending'){
      notes=[
        new VF.StaveNote({clef:'treble',keys:['c/5'],duration:'h',stem_direction:-1}),
        new VF.StaveNote({clef:'treble',keys:['d/5'],duration:'h',stem_direction:-1})
      ];
    }else{
      notes=[
        new VF.StaveNote({clef:'treble',keys:['c/5'],duration:'q',stem_direction:-1}),
        new VF.StaveNote({clef:'treble',keys:['d/5'],duration:'q',stem_direction:-1}),
        new VF.StaveNote({clef:'treble',keys:['g/4'],duration:'h',stem_direction:1})
      ];
    }
    const voice=new VF.Voice({num_beats:4,beat_value:4}).addTickables(notes);
    new VF.Formatter().joinVoices([voice]).formatToStave([voice],st,{align_rests:false});
    voice.draw(ctx,st);
    if(mode==='both'){
      requestAnimationFrame(()=>{
        const wrap=el.closest('.melodic-board-wrap'); if(!wrap)return;
        wrap.querySelectorAll('.melodic-callout,.melodic-leader').forEach(n=>n.remove());
        const svg=el.querySelector('svg'), sr=svg?.getBoundingClientRect(), wr=wrap.getBoundingClientRect();
        if(!sr)return;
        const centers=notes.map(n=>{
          const bb=n.getBoundingBox?.();
          if(bb)return {x:sr.left-wr.left+bb.getX()+bb.getW()/2,y:sr.top-wr.top+bb.getY()+bb.getH()/2};
          return {x:wr.width/2,y:wr.height/2};
        });
        const upX=(centers[0].x+centers[1].x)/2, downX=(centers[1].x+centers[2].x)/2, labelY=10;
        [['上行',upX],['下行',downX]].forEach(([t,x])=>{
          const lab=document.createElement('div'); lab.className='melodic-callout'; lab.textContent=t; lab.style.left=x+'px'; wrap.appendChild(lab);
        });
        makeLeader(wrap,centers[0].x,centers[0].y-5,upX,labelY+22);
        makeLeader(wrap,centers[1].x,centers[1].y-5,upX,labelY+22);
        makeLeader(wrap,centers[1].x,centers[1].y+3,downX,labelY+22);
        makeLeader(wrap,centers[2].x,centers[2].y-5,downX,labelY+22);
      });
    }
  }catch(e){ el.innerHTML='<div class="tiny" style="padding:40px;text-align:center">谱例暂时无法显示。</div>'; }
}
function renderMelodicBoard(mode){
  board.innerHTML='<div class="melodic-board-wrap"><div class="melodic-board"><div id="melodicStaff" style="width:100%;height:100%"></div></div></div>';
  drawMelodicBoard($('#melodicStaff'),mode);
}


function drawHarmonicBoard(el){
  el.innerHTML=''; const VF=vf(); if(!VF)return;
  try{
    const w=responsiveStaffWidth(el,260,760), r=new VF.Renderer(el,VF.Renderer.Backends.SVG);
    r.resize(w,176); const ctx=r.getContext(), st=new VF.Stave(8,38,w-16);
    st.addClef('treble').addTimeSignature('4/4').setContext(ctx).draw();

    // Preserve the page-12 melodic positions: C5, D5, G4.
    // Page 13 only changes C5/D5 stems upward and adds E4/F4 beneath them.
    const c5=new VF.StaveNote({clef:'treble',keys:['c/5'],duration:'q',stem_direction:1});
    const d5=new VF.StaveNote({clef:'treble',keys:['d/5'],duration:'q',stem_direction:1});
    const g4=new VF.StaveNote({clef:'treble',keys:['g/4'],duration:'h',stem_direction:1});
    const e4=new VF.StaveNote({clef:'treble',keys:['e/4'],duration:'h',stem_direction:-1});
    const f4=new VF.StaveNote({clef:'treble',keys:['f/4'],duration:'h',stem_direction:-1});

    const upper=new VF.Voice({num_beats:4,beat_value:4}).addTickables([c5,d5,g4]);
    const lower=new VF.Voice({num_beats:4,beat_value:4}).addTickables([e4,f4]);
    new VF.Formatter().joinVoices([upper,lower]).formatToStave([upper,lower],st,{align_rests:false});
    upper.draw(ctx,st); lower.draw(ctx,st);
  }catch(e){el.innerHTML='<div class="tiny" style="padding:40px;text-align:center">谱例暂时无法显示。</div>'}
}
function renderHarmonicBoard(){
  board.innerHTML='<div class="melodic-board"><div id="harmonicStaff" style="width:100%;height:100%"></div></div>';
  drawHarmonicBoard($('#harmonicStaff'));
}

function renderCompactKeyboard(active=[]){
  const naturals=['C4','D4','E4','F4','G4','A4','B4','C5','D5','E5','F5','G5','A5','B5','C6'];
  const blackAfter={C4:'C#4',D4:'D#4',F4:'F#4',G4:'G#4',A4:'A#4',C5:'C#5',D5:'D#5',F5:'F#5',G5:'G#5',A5:'A#5'};
  board.innerHTML='<div class="compact-keyboard-scroll"><div class="compact-keyboard" id="compactKeyboard"></div></div>';
  const kb=$('#compactKeyboard');
  naturals.forEach((n,i)=>{
    const k=document.createElement('div'); k.className='white-key'+(active.includes(n)?' active':'');
    k.innerHTML=`<span class="key-label">${n.replace(/[45]/,'')}</span>`; kb.appendChild(k);
    const sharp=blackAfter[n];
    if(sharp){
      const b=document.createElement('div'); b.className='black-key'+(active.includes(sharp)?' active':'');
      b.style.left=(8+(i+1)*29)+'px'; kb.appendChild(b);
    }
  });
  requestAnimationFrame(()=>{
    const scroll=board.querySelector('.compact-keyboard-scroll');
    const first=kb.querySelector('.active');
    if(scroll&&first) scroll.scrollLeft=Math.max(0,first.offsetLeft-scroll.clientWidth*.28);
  });
}
function drawToneCountStaff(el){
  el.innerHTML=''; const VF=vf(); if(!VF)return;
  try{
    const w=responsiveStaffWidth(el,260,760), r=new VF.Renderer(el,VF.Renderer.Backends.SVG);
    r.resize(w,176); const ctx=r.getContext();
    const groups=[
      {upper:'e/4',acc:null,label:'2'},
      {upper:'e/4',acc:'b',label:'1.5'},
      {upper:'e/4',acc:'#',label:'2.5'}
    ];
    const gap=5,left=8,usable=w-left*2-gap*2,sw=usable/3;
    const labelY=151, ns='http://www.w3.org/2000/svg';
    groups.forEach((g,i)=>{
      const st=new VF.Stave(left+i*(sw+gap),34,sw);
      if(i===0)st.addClef('treble');
      st.setContext(ctx).draw();
      const note=new VF.StaveNote({clef:'treble',keys:['c/4',g.upper],duration:'w'});
      if(g.acc)note.addModifier(new VF.Accidental(g.acc),1);
      const voice=new VF.Voice({num_beats:4,beat_value:4}).addTickables([note]);
      new VF.Formatter().joinVoices([voice]).formatToStave([voice],st);
      voice.draw(ctx,st);
      const svg=el.querySelector('svg');
      if(svg){
        const t=document.createElementNS(ns,'text');
        t.setAttribute('x',left+i*(sw+gap)+sw/2);t.setAttribute('y',labelY);
        t.setAttribute('text-anchor','middle');t.setAttribute('font-family','Arial,sans-serif');

function bindToneNumberQuiz(){
  const opts=[...document.querySelectorAll('[data-tone-answer]')];
  let wrong=new Set();
  opts.forEach(btn=>btn.addEventListener('click',()=>{
    if(btn.dataset.toneAnswer==='4'){
      btn.classList.add('correct');
      return;
    }
    btn.classList.add('wrong');
    wrong.add(btn.dataset.toneAnswer);
    if(wrong.size>=4){
      const correct=document.querySelector('[data-tone-answer="4"]');
      if(correct)correct.classList.add('correct');
    }
  }));
}

{title:'一度到八度与谱面规律',render(){body.innerHTML=`<p class="lead">固定 C4 为起点，点击 1–8 度，观察第二个音在五线谱上的位置变化。</p><div class="interaction-hint">互动操作：先点击 1–8 度，再比较下方“奇数度”和“偶数度”两张规律卡。</div><div class="stage"><div class="staff" id="s5"></div><div class="degree-grid">${degreeCN.map((x,i)=>`<button class="degree-btn ${i===learningState.degree5?'active':''}" data-d="${i}">${i+1}</button>`).join('')}</div><div class="readout" id="r5">C4 → C4 · 一度</div><div class="audio-row"><button class="audio-btn" id="play5">▶ 播放音程</button></div></div><div class="pattern-cards"><div class="pattern-card"><h3>奇数度</h3><p class="tiny">两个音同类分布：线—线，或间—间。</p><div class="staff small" id="odd5"></div><div class="example-chips"><button class="example-chip active" id="ll5">E–G · 线—线</button><button class="example-chip" id="ss5">F–A · 间—间</button></div></div><div class="pattern-card"><h3>偶数度</h3><p class="tiny">两个音异类分布：线—间，或间—线。</p><div class="staff small" id="even5"></div><div class="example-chips"><button class="example-chip active" id="ls5">E–A · 线—间</button><button class="example-chip" id="sl5">F–B · 间—线</button></div></div></div>`;let d=learningState.degree5;const rr=()=>{drawStaff($('#s5'),['c4',degreeNotes[d]]);$('#r5').textContent=`C4 → ${degreeNotes[d].replace('s','♯').toUpperCase()} · ${degreeCN[d]}`};rr();document.querySelectorAll('.degree-btn').forEach(b=>b.onclick=()=>{d=+b.dataset.d;learningState.degree5=d;document.querySelectorAll('.degree-btn').forEach(x=>x.classList.toggle('active',x===b));rr()});$('#play5').onclick=()=>playSeq('c4',degreeNotes[d]);const setPair=(staff,notes,a,b)=>{drawStaff($(staff),notes,{harmonic:true});$(a).classList.add('active');$(b).classList.remove('active')};drawStaff($('#odd5'),['e4','g4'],{harmonic:true});drawStaff($('#even5'),['e4','a4'],{harmonic:true});$('#ll5').onclick=()=>setPair('#odd5',['e4','g4'],'#ll5','#ss5');$('#ss5').onclick=()=>setPair('#odd5',['f4','a4'],'#ss5','#ll5');$('#ls5').onclick=()=>setPair('#even5',['e4','a4'],'#ls5','#sl5');$('#sl5').onclick=()=>setPair('#even5',['f4','b4'],'#sl5','#ls5')}},{title:'构建一个音程',render(){body.innerHTML=`<p class="lead">现在反过来操作：根据指定的度数，选择正确的第二个音。</p><div class="interaction-hint">需要你来完成：请选择 E、F、G、A 中的一个音，构建 C 上方的五度。</div><div class="stage"><div class="staff" id="s6"></div><div class="readout">请构建 C 上方的五度</div><div class="choices" id="build6"><button class="choice" data-note="e4">E</button><button class="choice" data-note="f4">F</button><button class="choice" data-note="g4">G</button><button class="choice" data-note="a4">A</button></div><div class="feedback" id="b6fb"></div></div><div class="rule">Learning Check 只用于确认理解，不计入课后练习成绩。</div>`;const applyBuild=n=>{drawStaff($('#s6'),n?['c4',n]:['c4']);document.querySelectorAll('#build6 .choice').forEach(x=>{x.classList.remove('correct','wrong');if(x.dataset.note===n)x.classList.add(n==='g4'?'correct':'wrong')});if(n){const ok=n==='g4';$('#b6fb').className='feedback '+(ok?'ok':'bad');$('#b6fb').textContent=ok?'正确。C–D–E–F–G，共五个音名位置。':'还不是五度。从 C 开始，把起点和终点都算进去再试一次。'}};applyBuild(learningState.build6);document.querySelectorAll('#build6 .choice').forEach(b=>b.onclick=()=>{learningState.build6=b.dataset.note;applyBuild(learningState.build6)})}},
{title:'旋律音程与和声音程',render(){body.innerHTML=`<p class="lead">两个<strong>先后出现</strong>的音叫旋律音程；两个<strong>同时出现</strong>的音叫和声音程。</p><div class="interaction-hint">互动操作：依次点击上行、下行、同时三个按钮，观察音符位置和标题如何变化。</div><div class="stage"><div class="interval-mode-label" id="mode7">上行旋律音程</div><div class="staff" id="s7"></div><div class="direction-grid"><button class="audio-btn" id="up7">▶ C → G<br><small>上行</small></button><button class="audio-btn" id="down7">▶ G → C<br><small>下行</small></button><button class="audio-btn" id="harm7">▶ C + G<br><small>同时</small></button></div></div><div class="rule"><strong>旋律音程：</strong>先低后高 = 上行；先高后低 = 下行。<br><strong>和声音程：</strong>两个音同时出现。</div><div class="stage"><p class="lead"><strong>二度和声音程的记谱</strong></p><div class="notation-demo"><div><div class="staff small" id="s7b"></div><div class="notation-caption">单声部式写法：符头错开，可共享符干</div></div><div><div class="staff small" id="s7c"></div><div class="notation-caption">多声部写法：两个音可以使用独立符干</div></div></div><p class="tiny">同谱表二度和声音程为了避免符头重叠，需要左右错开；左右位置本身不表示哪个音更高。多声部记谱时，两个音也不一定共享同一根符干。</p></div>`;const show=(type,withSound=true)=>{learningState.mode7=type;if(type==='up'){drawStaff($('#s7'),['c4','g4']);$('#mode7').textContent='上行旋律音程';if(withSound)playSeq('c4','g4')}else if(type==='down'){drawStaff($('#s7'),['g4','c4']);$('#mode7').textContent='下行旋律音程';if(withSound)playSeq('g4','c4')}else{drawStaff($('#s7'),['c4','g4'],{harmonic:true});$('#mode7').textContent='和声音程';if(withSound)playTogether('c4','g4')}};show(learningState.mode7,false);drawStaff($('#s7b'),['c4','d4'],{harmonic:true});drawPolyphonicSecond($('#s7c'));$('#up7').onclick=()=>show('up');$('#down7').onclick=()=>show('down');$('#harm7').onclick=()=>show('harm')}},
{title:'音数：实际音高距离',render(){body.innerHTML=`<p class="lead">音程中所包含的<strong>全音和半音的数量</strong>叫<strong>音数</strong>。一个全音音数为 1，一个半音音数为 0.5。</p><div class="term-box"><strong>这一页的重点：</strong>全音和半音是用来“量距离”的单位；<strong>音数</strong>才是我们最终要得到的距离数值。</div><div class="interaction-hint">第一步：点击例子，先确认一个全音 = 1、一个半音 = 0.5。</div><div class="stage"><div class="keyboard-wrap"><div class="keyboard" id="kb"></div></div><div class="readout" id="kr">点击例子，观察键盘上的实际距离。</div></div><p class="tiny"><strong>全音示例</strong></p><div class="example-chips" id="whole8"><button class="example-chip" data-key="cd" data-a="c4" data-b="d4">C–D</button><button class="example-chip" data-key="de" data-a="d4" data-b="e4">D–E</button><button class="example-chip" data-key="fg" data-a="f4" data-b="g4">F–G</button><button class="example-chip" data-key="ga" data-a="g4" data-b="a4">G–A</button><button class="example-chip" data-key="ab" data-a="a4" data-b="b4">A–B</button></div><p class="tiny"><strong>半音示例</strong></p><div class="example-chips" id="half8"><button class="example-chip" data-key="ef" data-a="e4" data-b="f4">E–F</button><button class="example-chip" data-key="bc" data-a="b4" data-b="c5">B–C</button></div><div class="interaction-hint" style="margin-top:18px">第二步：现在直接测量音程。点击下面任意一组音，数一数它跨过几个半音，再换算成音数。</div><div class="stage"><div class="readout" id="pitchReadout">例如 C–E：4 个半音 = 2 个全音，所以音数 = 2。</div><div class="example-chips" id="pitch8"><button class="example-chip" data-key="ce" data-a="c4" data-b="e4">C–E</button><button class="example-chip" data-key="cf" data-a="c4" data-b="f4">C–F</button><button class="example-chip" data-key="cg" data-a="c4" data-b="g4">C–G</button><button class="example-chip" data-key="df" data-a="d4" data-b="f4">D–F</button><button class="example-chip" data-key="bd" data-a="b4" data-b="d5">B–D</button></div></div><div class="rule"><strong>计算方法：</strong>先数实际相隔的半音数量，再用“每个半音 = 0.5”换算。比如 5 个半音的音数就是 2.5。</div>`;makeKeyboard();const allBtns=()=>document.querySelectorAll('#whole8 .example-chip,#half8 .example-chip,#pitch8 .example-chip');const activate=(b)=>{allBtns().forEach(x=>x.classList.remove('active'));b.classList.add('active')};const showBasic=(b)=>{activate(b);const a=b.dataset.a,c=b.dataset.b,path=semitonePath(a,c),n=semitoneCount(a,c);highlightKeys(path);playSeq(a,c);$('#kr').textContent=`${labelNote(a)} → ${labelNote(c)}：${n} 个半音 = 音数 ${n*.5}`;learningState.example8=b.dataset.key};document.querySelectorAll('#whole8 .example-chip,#half8 .example-chip').forEach(b=>b.onclick=()=>showBasic(b));document.querySelectorAll('#pitch8 .example-chip').forEach(b=>b.onclick=()=>{activate(b);const a=b.dataset.a,c=b.dataset.b,path=semitonePath(a,c),n=semitoneCount(a,c);highlightKeys(path);playSeq(a,c);$('#pitchReadout').textContent=`${labelNote(a)} → ${labelNote(c)}：跨过 ${n} 个半音 → ${n} × 0.5 = 音数 ${n*.5}`;learningState.pitch8=b.dataset.key});const saved=[...allBtns()].find(b=>b.dataset.key===learningState.pitch8)||[...allBtns()].find(b=>b.dataset.key===learningState.example8);if(saved){activate(saved);const a=saved.dataset.a,c=saved.dataset.b,path=semitonePath(a,c),n=semitoneCount(a,c);highlightKeys(path);if(saved.closest('#pitch8'))$('#pitchReadout').textContent=`${labelNote(a)} → ${labelNote(c)}：跨过 ${n} 个半音 → ${n} × 0.5 = 音数 ${n*.5}`;else $('#kr').textContent=`${labelNote(a)} → ${labelNote(c)}：${n} 个半音 = 音数 ${n*.5}`}}},{title:'度数 ≠ 音数',render(){body.innerHTML=`<p class="lead">最后把两个概念放在一起比较：<strong>度数看音名 / 谱表位置；音数看实际音高距离。</strong></p><div class="interaction-hint">互动操作：分别点击两组谱例按钮，注意变音记号、谱表位置与实际声音的关系。</div><div class="stage"><div class="staff" id="s9a"></div><table class="compare"><tr><th></th><th>C–E</th><th>C–E♭</th></tr><tr><td>度数</td><td>3</td><td>3</td></tr><tr><td>音数</td><td>2</td><td>1.5</td></tr></table><div class="audio-row"><button class="audio-btn" id="ce9">▶ C–E</button><button class="audio-btn" id="ceb9">▶ C–E♭</button></div></div><div class="rule"><strong>结论 1：</strong>度数相同，音数可以不同。</div><div class="stage"><div class="staff" id="s9b"></div><table class="compare"><tr><th></th><th>C–F♯</th><th>C–G♭</th></tr><tr><td>度数</td><td>4</td><td>5</td></tr><tr><td>音数</td><td>3</td><td>3</td></tr></table><div class="audio-row"><button class="audio-btn" id="cfs9">▶ C–F♯</button><button class="audio-btn" id="cgb9">▶ C–G♭</button></div></div><div class="rule"><strong>结论 2：</strong>音数相同，度数也不一定相同。</div>`;drawStaff($('#s9a'),['c4','e4']);drawStaff($('#s9b'),['c4','fs4']);$('#ce9').onclick=()=>{drawStaff($('#s9a'),['c4','e4']);playSeq('c4','e4')};$('#ceb9').onclick=()=>{drawStaff($('#s9a'),['c4','eb4']);playSeq('c4','eb4')};$('#cfs9').onclick=()=>{drawStaff($('#s9b'),['c4','fs4']);playSeq('c4','fs4')};$('#cgb9').onclick=()=>{drawStaff($('#s9b'),['c4','gb4']);playSeq('c4','gb4')}}}
];
function labelNote(n){return n.replace(/s/,'♯').replace(/b/,'♭').replace(/\d/,'').toUpperCase()}
function makeKeyboard(){const kb=$('#kb'),white=['c4','d4','e4','f4','g4','a4','b4','c5'],black=[['cs4',12.5],['ds4',25],['fs4',50],['gs4',62.5],['as4',75]];kb.innerHTML=white.map(n=>`<div class="white-key" data-note="${n}">${n.replace('4','').replace('5','').toUpperCase()}</div>`).join('')+black.map(([n,l])=>`<div class="black-key" style="left:${l}%" data-note="${n}">${n[0].toUpperCase()}♯</div>`).join('');kb.querySelectorAll('[data-note]').forEach(k=>k.onclick=()=>{play(k.dataset.note);highlightKeys([k.dataset.note]);$('#kr').textContent=k.dataset.note.replace('s','♯').toUpperCase()})}
function highlightKeys(ns){document.querySelectorAll('#kb [data-note]').forEach(k=>k.classList.toggle('on',ns.includes(k.dataset.note)))}
function showStep(i,doScroll=true){const previous=current;current=i;document.body.classList.add('lesson-active');home.classList.add('hidden');summary.classList.add('hidden');lesson.classList.remove('hidden');lesson.classList.toggle('opening',i<2);$('#stepNo').textContent='LEARNING';$('#stepTitle').textContent=steps[i].title;$('#stepCount').textContent=`${String(i+1).padStart(2,'0')} / ${String(steps.length).padStart(2,'0')}`;$('#progress').style.width=((i+1)/steps.length*100)+'%';$('#prevBtn').textContent=i===0?'返回首页':'← 上一步';$('#nextBtn').textContent=i===steps.length-1?'完成学习':'继续 →';steps[i].render();updateHeaderLessonCount(i);revealNewestLessonText();if(doScroll){requestAnimationFrame(()=>{const goingForward=i>previous;if(i<5&&goingForward&&body.scrollHeight>body.clientHeight){body.scrollTo({top:body.scrollHeight,behavior:'smooth'})}else{body.scrollTo({top:0,behavior:'smooth'})}})}}

$('#startLearning').onclick=startLesson;$('#prevBtn').onclick=()=>{if(current===0)goHome();else if(current===1){openingSecondRevealed=false;showStep(0)}else showStep(current-1)};$('#nextBtn').onclick=()=>{if(current===0){showStep(1)}else if(current<steps.length-1)showStep(current+1);else showSummary()};$('#backHome').onclick=goHome;
function goHome(){openingSecondRevealed=false;current=0;document.body.classList.remove('lesson-active');clearBoard();lesson.classList.add('hidden');summary.classList.add('hidden');home.classList.remove('hidden');$('#progress').style.width='0%';window.scrollTo({top:0,behavior:'smooth'})}
function showSummary(){document.body.classList.remove('lesson-active');clearBoard();lesson.classList.add('hidden');summary.classList.remove('hidden');$('#progress').style.width='100%';window.scrollTo({top:0,behavior:'smooth'})}
// 页面切换时重新渲染谱例；不在 resize 时重置当前互动状态。
</script>
</body></html>
