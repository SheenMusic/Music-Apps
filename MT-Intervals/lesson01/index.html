/* Lesson 01 opening sequence */
.intro-flow{position:relative}.intro-scene{padding:4px 0 28px}.intro-definition{font-size:1.12rem;line-height:2.08;color:#475569;margin:2px 0 18px}.intro-definition strong{color:var(--text);font-weight:900}.intro-role-text strong{font-weight:900;color:var(--text)}.key-accent{color:var(--primary);font-weight:900}.intro-stage{background:transparent;border:0;padding:0;margin:10px 0 0}.intro-staff-wrap{position:relative}.intro-staff-wrap .staff{background:#fff}.note-role{position:absolute;top:8px;z-index:3;font-size:.78rem;font-weight:900;color:var(--primary);opacity:0;transform:translateY(10px);transition:opacity .55s ease,transform .55s ease;pointer-events:none;white-space:nowrap}.note-role.visible{opacity:1;transform:translateY(0)}.note-role.root{left:calc(32% - 5mm);transform:translate(-50%,10px)}.note-role.crown{left:60%;transform:translate(-50%,10px)}.note-role.root.visible,.note-role.crown.visible{transform:translate(-50%,0)}.intro-second{padding-top:26px;opacity:0;transform:translateY(28px);transition:opacity .65s ease,transform .65s ease}.intro-second.visible{opacity:1;transform:translateY(0)}.intro-role-text{font-size:1.08rem;line-height:2.08;color:#475569;margin-top:20px}.magic-ghost{position:fixed;z-index:9999;margin:0;pointer-events:none;font-weight:800;color:var(--text);transition:all .72s cubic-bezier(.22,.8,.2,1),opacity .2s ease .56s;transform-origin:left top}.step-head{justify-content:flex-end;margin-bottom:12px}.step-head>div:first-child{display:none}.lesson.opening .step-head{display:flex}.lesson.opening #stepBody{padding-top:2px}.lesson{padding-bottom:88px}.lesson .nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:50;width:min(500px,calc(100% - 20px));margin:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(248,250,252,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);border-radius:14px 14px 0 0}.degree-explain{font-size:1.08rem;line-height:2.08;colo /* Fixed lesson workspace: header / blackboard / scrollable text / controls */
body.lesson-active{height:100dvh;overflow:hidden;padding-bottom:10px}
body.lesson-active .app{height:calc(100dvh - 20px);min-height:0}
body.lesson-active header{flex:0 0 auto;margin-bottom:10px}
body.lesson-active main{flex:1;min-height:0;display:flex;flex-direction:column}
body.lesson-active #lesson{flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:0;margin-bottom:8px;overflow:hidden}
body.lesson-active #lesson.hidden{display:none!important}
.lesson-board{flex:0 0 auto;position:relative;min-height:0}
.lesson-board:empty{display:none}
.lesson-board .intro-stage{margin:0}
.lesson-board .staff{min-height:145px}
.lesson-content{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 2px 18px;scroll-behavior:smooth}
body.lesson-active .lesson .nav{position:static;left:auto;bottom:auto;transform:none;flex:0 0 auto;width:auto;margin:8px 0 0;padding:10px 0 0;background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none;border-top:1px solid var(--border);border-radius:0}
body.lesson-active .footer{flex:0 0 auto;margin-top:0;padding:4px 0 0}
body.lesson-active .step-head{flex:0 0 auto;margin-bottom:8px}
.board-role-wrap{position:relative}.board-role-wrap .staff{background:#fff}
.board-note-role{position:absolute;top:8px;z-index:3;font-size:.78rem;font-weight:900;color:var(--primary);opacity:0;transform:translate(-50%,10px);transition:opacity .55s ease,transform .55s ease;pointer-events:none;white-space:nowrap}
.board-note-role.visible{opacity:1;transform:translate(-50%,0)}
.board-note-role.root{left:32%}.board-note-role.crown{left:60%}
.degree-note-names .endpoint{font-size:1.08rem;font-weight:900;color:var(--text)}
.degree-note-names .middle{font-size:.84rem;font-weight:650;color:#94a3b8}

/* Stable lesson frame v3 */
body.lesson-active #lesson{padding:20px 24px;margin-bottom:10px}
body.lesson-active .lesson-board{height:178px;min-height:178px;max-height:178px;flex:0 0 178px;overflow:hidden;margin:0}
body.lesson-active .lesson-board:empty{display:block}
body.lesson-active .lesson-board .staff{height:176px;min-height:176px}
body.lesson-active .lesson-content{padding:16px 2px 12px;overscroll-behavior:contain}
.lesson-footer-zone{display:none}
body.lesson-active .lesson-footer-zone{display:block;flex:0 0 auto}
.lesson-footer-zone .nav{display:flex;gap:10px;margin:0 0 6px}
.lesson-footer-zone .nav>*{flex:1}
body.lesson-active #lesson .nav{display:none}
body.lesson-active .footer{padding:2px 0 0}
.lesson-paragraph{font-size:1.12rem;line-height:2.08;color:#475569;margin:0}
.lesson-paragraph + .lesson-paragraph{margin-top:1.25em}
.lesson-paragraph strong{font-weight:900;color:var(--text)}
@media(max-width:400px){.card{padding:20px 17px}.pattern-cards{grid-template-columns:1fr}.degree-grid{grid-template-columns:repeat(4,1fr)}.summary-list{grid-template-columns:1fr}.direction-grid{grid-template-columns:1fr}.two-col{grid-template-columns:1fr}}

/* Degree sequence boards */
.degree-sequence-board{height:100%;display:flex;align-items:center;justify-content:center;padding:0 6px}
.degree-sequence-board svg{display:block;width:100%;height:100%}
.degree-list-board{height:100%;display:flex;align-items:center;justify-content:center;padding:0 2px}
.degree-list-board svg{display:block;width:100%;height:100%}

/* Melodic interval boards */
.melodic-board{height:100%;display:flex;align-items:center;justify-content:center;padding:0 6px}
.melodic-board svg{display:block;width:100%;height:100%}
.melodic-board-wrap{position:relative;width:100%;height:100%}
.melodic-callout{position:absolute;top:8px;transform:translateX(-50%);font-size:15px;font-weight:750;color:var(--accent);letter-spacing:.04em;pointer-events:none}
.melodic-leader{position:absolute;height:1.5px;background:var(--accent);transform-origin:0 50%;pointer-events:none;opacity:.85}

/* Inline lesson quiz */
.quiz-block{margin-top:30px;padding-top:24px;border-top:1px solid var(--border)}
.quiz-kicker{font-family:Arial,sans-serif;font-size:14px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.quiz-question{font-size:20px;line-height:1.85;font-weight:650;margin-bottom:16px}
.quiz-options{display:flex;gap:12px;flex-wrap:wrap}
.quiz-option{appearance:none;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:999px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer;transition:.18s ease;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.quiz-option.correct{border-color:#34c759;background:#edf9f0;color:#218739}
.quiz-option.wrong{border-color:#ff3b30;background:#fff0ef;color:#c92a22}

/* Stable frame fixes v4 */
body.lesson-active{overflow:hidden;padding-top:10px;padding-bottom:10px}
body.lesson-active header{display:block!important;visibility:visible!important;opacity:1!important;position:relative;z-index:20}
body.lesson-active .lesson-board{border:1px solid var(--border);border-radius:12px;background:#fff}
body.lesson-active .lesson-board .staff{border:0;border-radius:11px}
body.lesson-active .lesson-board .intro-stage{height:100%}
body.lesson-active .lesson-board .board-role-wrap{height:100%}
.lesson-footer-zone button,.lesson-footer-zone .primary,.lesson-footer-zone .ghost{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.lesson-footer-zone{touch-action:manipulation}

/* Responsive lesson frame */
.lesson-top{display:flex;align-items:center;justify-content:space-between;gap:14px;min-width:0}
.lesson-top .brand{min-width:0;white-space:nowrap}
.lesson-meta{display:flex;align-items:center;justify-content:flex-end;gap:.5ch;min-width:0;white-space:nowrap}
.lesson-meta .lesson-count{font-size:12px;font-weight:750;color:var(--muted);letter-spacing:.04em}
.lesson-meta .lesson-id{font-size:12px;font-weight:800;letter-spacing:.08em}
#lessonStep{display:none!important}
.lesson-body{scroll-behavior:smooth;overscroll-behavior:contain}
.board{overflow:hidden}
.board svg{max-width:100%;height:auto}
@media(max-width:520px){
  .lesson-top{gap:8px}
  .lesson-top .brand{font-size:clamp(10px,3vw,13px);letter-spacing:.04em}
  .lesson-meta{gap:.5ch}
  .lesson-meta .lesson-count,.lesson-meta .lesson-id{font-size:clamp(9px,2.7vw,12px)}
}
@media(max-width:360px){
  .lesson-top .brand{font-size:9px;letter-spacing:.02em}
  .lesson-meta{gap:.5ch}
  .lesson-meta .lesson-count,.lesson-meta .lesson-id{font-size:9px;letter-spacing:0}
}


/* iPhone safe-area protection */
body{padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.lesson-shell,.lesson-view{max-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
.lesson-footer{padding-bottom:max(0px,env(safe-area-inset-bottom))}


#lessonStep,.lesson-step,.step-indicator,.page-indicator,.lesson-progress-text{display:none!important}
#headerLessonCount{display:inline!important}


/* Compact two-octave keyboard for pages 15–18 */
.compact-keyboard-scroll{width:100%;height:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;display:flex;align-items:center}
.compact-keyboard{position:relative;height:132px;min-width:420px;margin:auto;display:flex;padding:0 8px;box-sizing:border-box}
.compact-keyboard .white-key{position:relative;width:29px;min-width:29px;height:128px;border:1px solid #cfd2d7;border-radius:0 0 5px 5px;background:#fff;box-sizing:border-box}
.compact-keyboard .white-key.active{background:#fff0e8;border-color:var(--accent);box-shadow:inset 0 -4px 0 var(--accent)}
.compact-keyboard .black-key{position:absolute;top:0;width:18px;height:78px;background:#222;border-radius:0 0 4px 4px;z-index:3;transform:translateX(-50%)}
.compact-keyboard .black-key.active{background:#c98763;box-shadow:inset 0 -3px 0 rgba(0,0,0,.16)}
.compact-keyboard .key-label{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font:700 10px Arial,sans-serif;color:#6e6e73}
.compact-keyboard .white-key.active .key-label{color:var(--accent)}
.tone-count-board{height:100%;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tone-count-board svg{display:block;width:100%;height:100%}


/* === Authoritative iOS header / safe-area fix ===
   Keep this block last: earlier lesson-active rules used padding-top:10px,
   which overrode body{padding-top:env(safe-area-inset-top)} by specificity. */
html{height:100%;background:var(--bg)}
body{
  min-height:100dvh;
  padding-left:max(10px,env(safe-area-inset-left));
  padding-right:max(10px,env(safe-area-inset-right));
}
body.lesson-active{
  height:100dvh;
  min-height:100dvh;
  overflow:hidden;
  padding-top:max(10px,env(safe-area-inset-top))!important;
  padding-bottom:max(10px,env(safe-area-inset-bottom))!important;
}
body.lesson-active .app{
  height:calc(100dvh - max(10px,env(safe-area-inset-top)) - max(10px,env(safe-area-inset-bottom)))!important;
  min-height:0;
}
body.lesson-active header{
  position:relative!important;
  top:auto!important;
  flex:0 0 auto;
  z-index:100;
  margin-bottom:10px;
  transform:none!important;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  min-width:0;
}
.topbar-brand{
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.topbar-right{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:.5ch;
  flex:0 0 auto;
  white-space:nowrap;
}
.topbar-right .lesson-count{
  display:inline!important;
  font-size:inherit;
}
@media(max-width:390px){
  .topbar{font-size:clamp(.58rem,2.7vw,.76rem);letter-spacing:.2px}
  .lesson-badge{padding:3px 6px}
}
@media(max-width:330px){
  .topbar{font-size:.56rem}
  .topbar-brand{letter-spacing:0}
  .lesson-badge{padding:2px 5px}
}


/* Final lesson-space cleanup */
.lesson-progress,.step-indicator,#lessonStep,.lesson-step,.page-indicator,.lesson-progress-text{display:none!important}
.lesson-main{padding-top:0!important}
.board{margin-top:0!important}


.quiz-options.vertical{display:grid;grid-template-columns:1fr;gap:9px;max-width:220px}
.quiz-options.vertical .quiz-option{text-align:left;width:100%}


/* Home title aligned with Practice naming */
.home-course-title{text-align:center;margin:2px 0 24px}
.home-course-index{font-size:.92rem;line-height:1.4;font-weight:800;letter-spacing:.06em;color:var(--primary);margin-bottom:7px}
.home-course-title h1{margin:0;font-size:clamp(1.42rem,5vw,2rem);line-height:1.35;font-weight:900;color:var(--text);letter-spacing:-.025em}


/* Mobile landscape lesson mode: left board / right text */
@media (orientation:landscape) and (max-height:500px) and (max-width:950px){
  body.lesson-active{padding-top:6px!important;padding-bottom:4px!important}
  body.lesson-active .app{height:calc(100dvh - 10px)!important}
  body.lesson-active header{margin-bottom:5px!important}
  .topbar{font-size:.64rem}
  .lesson-badge{padding:2px 6px}

function drawStaff(el,notes,{clef='treble',harmonic=false}={}){el.innerHTML='';const VF=vf();if(!VF){el.innerHTML='<div class="tiny" style="padding:40px;text-align:center">五线谱组件未载入，请检查网络连接。</div>';return}try{const w=responsiveStaffWidth(el,260,760),r=new VF.Renderer(el,VF.Renderer.Backends.SVG);r.resize(w,140);const ctx=r.getContext(),st=new VF.Stave(12,30,w-24);st.addClef(clef).setContext(ctx).draw();const makeKey=n=>{const x=parseNote(n);return x.letter+'/'+x.oct};const addAcc=(sn,n,i=0)=>{const x=parseNote(n);if(x.acc)sn.addModifier(new VF.Accidental(x.acc==='s'?'#':'b'),i)};let ns;if(harmonic){const sn=new VF.StaveNote({clef,keys:notes.map(makeKey),duration:'q'});notes.forEach((n,i)=>addAcc(sn,n,i));ns=[sn]}else{ns=notes.map(n=>{const sn=new VF.StaveNote({clef,keys:[makeKey(n)],duration:'q'});addAcc(sn,n);return sn})}VF.Formatter.FormatAndDraw(ctx,st,ns,{auto_beam:false})}catch(e){el.innerHTML='<div class="tiny" style="padding:40px;text-align:center">谱例暂时无法显示。</div>'}}

  try{
    const w=responsiveStaffWidth(el,260,760), r=new VF.Renderer(el,VF.Renderer.Backends.SVG);
    r.resize(w,176); const ctx=r.getContext();
    const groups=w<380?[['f4','g4'],['g4','a4']]:[['f4','g4'],['g4','a4'],['a4','b4']];
    const st=new VF.Stave(8,38,w-16);
    st.addClef('treble').setContext(ctx).draw();
    const tickables=[];
    groups.forEach((pair,gi)=>{
      pair.forEach(n=>{
        const x=parseNote(n);
        tickables.push(new VF.StaveNote({clef:'treble',keys:[x.letter+'/'+x.oct],duration:'w'}));

    const voice=new VF.Voice({num_beats:groups.length*8,beat_value:4}).setMode(VF.Voice.Mode.SOFT).addTickables(tickables);
    new VF.Formatter().joinVoices([voice]).formatToStave([voice],st,{align_rests:false});

function makeLeader(container,x1,y1,x2,y2){
  const line=document.createElement('div'); line.className='melodic-leader';
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;
  line.style.left=x1+'px'; line.style.top=y1+'px'; line.style.width=len+'px'; line.style.transform=`rotate(${ang}deg)`;
  container.appendChild(line);
}
function drawMelodicBoard(el,mode='ascending'){
  el.innerHTML=''; const VF=vf(); if(!VF)return;
  try{
    const w=responsiveStaffWidth(el,260,760), r=new VF.Renderer(el,VF.Renderer.Backends.SVG);
    r.resize(w,176); const ctx=r.getContext(), st=new VF.Stave(8,38,w-16);
    st.addClef('treble').addTimeSignature('4/4').setContext(ctx).draw();
    let notes;
    if(mode==='ascending'){
      notes=[
        new VF.StaveNote({clef:'treble',keys:['c/5'],duration:'h',stem_direction:-1}),
        new VF.StaveNote({clef:'treble',keys:['d/5'],duration:'h',stem_direction:-1})
      ];
    }else{
      notes=[
        new VF.StaveNote({clef:'treble',keys:['c/5'],duration:'q',stem_direction:-1}),
        new VF.StaveNote({clef:'treble',keys:['d/5'],duration:'q',stem_direction:-1}),
        new VF.StaveNote({clef:'treble',keys:['g/4'],duration:'h',stem_direction:1})
      ];
    }
    const voice=new VF.Voice({num_beats:4,beat_value:4}).addTickables(notes);
    new VF.Formatter().joinVoices([voice]).formatToStave([voice],st,{align_rests:false});
    voice.draw(ctx,st);
    if(mode==='both'){
      requestAnimationFrame(()=>{
        const wrap=el.closest('.melodic-board-wrap'); if(!wrap)return;
        wrap.querySelectorAll('.melodic-callout,.melodic-leader').forEach(n=>n.remove());
        const svg=el.querySelector('svg'), sr=svg?.getBoundingClientRect(), wr=wrap.getBoundingClientRect();
        if(!sr)return;
        const centers=notes.map(n=>{
          const bb=n.getBoundingBox?.();
          if(bb)return {x:sr.left-wr.left+bb.getX()+bb.getW()/2,y:sr.top-wr.top+bb.getY()+bb.getH()/2};
          return {x:wr.width/2,y:wr.height/2};
        });
        const upX=(centers[0].x+centers[1].x)/2, downX=(centers[1].x+centers[2].x)/2, labelY=10;
        [['上行',upX],['下行',downX]].forEach(([t,x])=>{
          const lab=document.createElement('div'); lab.className='melodic-callout'; lab.textContent=t; lab.style.left=x+'px'; wrap.appendChild(lab);
        });
        makeLeader(wrap,centers[0].x,centers[0].y-5,upX,labelY+22);
        makeLeader(wrap,centers[1].x,centers[1].y-5,upX,labelY+22);
        makeLeader(wrap,centers[1].x,centers[1].y+3,downX,labelY+22);
        makeLeader(wrap,centers[2].x,centers[2].y-5,downX,labelY+22);
      });
    }
  }catch(e){ el.innerHTML='<div class="tiny" style="padding:40px;text-align:center">谱例暂时无法显示。</div>'; }
}

  board.innerHTML='<div class="melodic-board-wrap"><div class="melodic-board"><div id="melodicStaff" style="width:100%;height:100%"></div></div></div>';

function drawHarmonicBoard(el){
  el.innerHTML=''; const VF=vf(); if(!VF)return;
  try{
    const w=responsiveStaffWidth(el,260,760), r=new VF.Renderer(el,VF.Renderer.Backends.SVG);
    r.resize(w,176); const ctx=r.getContext(), st=new VF.Stave(8,38,w-16);
    st.addClef('treble').addTimeSignature('4/4').setContext(ctx).draw();

    // Preserve the page-12 melodic positions: C5, D5, G4.
    // Page 13 only changes C5/D5 stems upward and adds E4/F4 beneath them.
    const c5=new VF.StaveNote({clef:'treble',keys:['c/5'],duration:'q',stem_direction:1});
    const d5=new VF.StaveNote({clef:'treble',keys:['d/5'],duration:'q',stem_direction:1});
    const g4=new VF.StaveNote({clef:'treble',keys:['g/4'],duration:'h',stem_direction:1});
    const e4=new VF.StaveNote({clef:'treble',keys:['e/4'],duration:'h',stem_direction:-1});
    const f4=new VF.StaveNote({clef:'treble',keys:['f/4'],duration:'h',stem_direction:-1});

    const upper=new VF.Voice({num_beats:4,beat_value:4}).addTickables([c5,d5,g4]);
    const lower=new VF.Voice({num_beats:4,beat_value:4}).addTickables([e4,f4]);
    new VF.Formatter().joinVoices([upper,lower]).formatToStave([upper,lower],st,{align_rests:false});
    upper.draw(ctx,st); lower.draw(ctx,st);
  }catch(e){el.innerHTML='<div class="tiny" style="padding:40px;text-align:center">谱例暂时无法显示。</div>'}

function drawEnharmonicToneStaff(el){
  el.innerHTML=''; const VF=vf(); if(!VF)return;
  try{
    const w=responsiveStaffWidth(el,220,760),h=176;
    const r=new VF.Renderer(el,VF.Renderer.Backends.SVG); r.resize(w,h);
    const ctx=r.getContext(),left=8,right=8,staffW=w-left-right,staveY=38;
    const st=new VF.Stave(left,staveY,staffW);
    st.addClef('treble').setContext(ctx).draw();

    const svg=el.querySelector('svg'),ns='http://www.w3.org/2000/svg';

    const n1=new VF.StaveNote({clef:'treble',keys:['c/4','f/4'],duration:'w'});
    n1.addModifier(new VF.Accidental('#'),1);
    const n2=new VF.StaveNote({clef:'treble',keys:['c/4','g/4'],duration:'w'});
    n2.addModifier(new VF.Accidental('b'),1);

    const voice=new VF.Voice({num_beats:8,beat_value:4}).addTickables([n1,n2]);

    // Snapshot the SVG before the notes are drawn. This lets us inspect only
    // the final SVG geometry created by the notation pass.
    const before=new Set([...svg.querySelectorAll('*')]);
    new VF.Formatter().joinVoices([voice]).formatToStave([voice],st);
    voice.draw(ctx,st);
    const created=[...svg.querySelectorAll('*')].filter(node=>!before.has(node));

    // Equal geometric measures.
    const dividerX=left+staffW/2;
    const bar=document.createElementNS(ns,'line');
    bar.setAttribute('x1',dividerX);bar.setAttribute('x2',dividerX);
    bar.setAttribute('y1',st.getYForLine(0));bar.setAttribute('y2',st.getYForLine(4));
    bar.setAttribute('stroke','#111');bar.setAttribute('stroke-width','1');
    svg.appendChild(bar);

    /*
      Find the ACTUAL rendered whole-note notehead paths.

      We deliberately do not use:
        - TickContext X
        - StaveNote.getAbsoluteX()
        - NoteHead.getAbsoluteX()
        - the bounding box of the whole note+accidental group

      Instead we inspect final SVG paths and identify the four whole-note heads
      by their compact glyph geometry and their Y positions on this stave.
      Accidentals are taller/narrower glyphs and are excluded by geometry.
    */
    const expectedYs=[
      st.getYForNote(0), // retained only as a stave-relative reference
    ];

    const candidates=[];
    created.forEach(node=>{
      if(!(node instanceof SVGGraphicsElement)) return;
      if(node.tagName.toLowerCase()!=='path') return;
      try{
        const b=node.getBBox();
        // Whole-note heads are compact horizontal glyphs. Keep generous limits
        // for VexFlow/font/browser variation, while excluding accidentals/stems.
        if(b.width>=8 && b.width<=26 && b.height>=5 && b.height<=18){
          candidates.push({
            node,b,
            cx:b.x+b.width/2,
            cy:b.y+b.height/2
          });
        }
      }catch(_){}
    });

    // Group candidate noteheads by horizontal location. Each harmonic interval
    // contributes two heads at essentially the same X. The accidental paths do
    // not form such a two-head vertical pair.
    candidates.sort((a,b)=>a.cx-b.cx);
    const clusters=[];
    candidates.forEach(c=>{
      let cluster=clusters.find(g=>Math.abs(g.x-c.cx)<4);
      if(!cluster){
        cluster={x:c.cx,items:[]};
        clusters.push(cluster);
      }
      cluster.items.push(c);
      cluster.x=cluster.items.reduce((s,v)=>s+v.cx,0)/cluster.items.length;
    });

    // A chord cluster must contain at least two vertically distinct compact
    // notehead glyphs. Choose the two notation clusters from left to right.
    const chordClusters=clusters.filter(g=>{
      if(g.items.length<2)return false;
      const ys=g.items.map(v=>v.cy);
      return Math.max(...ys)-Math.min(...ys)>8;
    }).sort((a,b)=>a.x-b.x).slice(0,2);

    let x1=chordClusters[0]?.x ?? null;
    let x2=chordClusters[1]?.x ?? null;

    // Conservative fallback: if SVG glyph detection changes in a future
    // VexFlow build, fall back to the notehead API rather than losing labels.
    function fallbackX(note){
      try{
        const heads=note.getNoteHeads?note.getNoteHeads():[];
        if(heads.length){
          const h=heads[0];
          const x=typeof h.getAbsoluteX==='function'?h.getAbsoluteX():
                  (typeof h.getX==='function'?h.getX():NaN);
          if(Number.isFinite(x))return x;
        }
      }catch(_){}
      return null;
    }
    if(!Number.isFinite(x1))x1=fallbackX(n1);
    if(!Number.isFinite(x2))x2=fallbackX(n2);

    const add=(txt,x,y,size=11)=>{
      if(!Number.isFinite(x))return;
      const t=document.createElementNS(ns,'text');
      t.setAttribute('x',x);t.setAttribute('y',y);
      t.setAttribute('text-anchor','middle');
      t.setAttribute('font-family','Arial,sans-serif');
      t.setAttribute('font-size',size);t.setAttribute('font-weight','700');
      t.setAttribute('fill','#6e6e73');t.textContent=txt;svg.appendChild(t);
    };

    // Text follows the final visible notehead centres.
    add('4th',x1,25,w<360?9:11);
    add('5th',x2,25,w<360?9:11);
    add('3',x1,160,w<360?10:12);
    add('3',x2,160,w<360?10:12);

    const label=document.createElementNS(ns,'text');
    label.setAttribute('x',Math.max(12,left+6));label.setAttribute('y','160');
    label.setAttribute('font-family','PingFang SC,Arial,sans-serif');
    label.setAttribute('font-size',w<360?'9':'11');
    label.setAttribute('font-weight','700');label.setAttribute('fill','#6e6e73');
    label.textContent='音数';svg.appendChild(label);
  }catch(e){
    console.error('Page 21 SVG-notehead render failed:',e);
    el.innerHTML='<div class="tiny" style="padding:40px;text-align:center">谱例暂时无法显示。</div>';
  }
}

}

function bindChoiceQuiz(answer,attr='data-quiz-answer'){
  const opts=[...document.querySelectorAll('['+attr+']')],wrongValues=new Set();
  opts.forEach(btn=>btn.addEventListener('click',()=>{
    if(btn.getAttribute(attr)===answer){btn.classList.add('correct');passedQuizzes.add(current);setQuizContinueEnabled(true);return}
    btn.classList.add('wrong');wrongValues.add(btn.getAttribute(attr));
    if(wrongValues.size>=opts.length-1){
      const correct=document.querySelector('['+attr+'="'+answer+'"]');if(correct)correct.classList.add('correct');
    }
  }));
}

function bindToneNumberQuiz(){
  const opts=[...document.querySelectorAll('[data-tone-answer]')],wrong=new Set();
  opts.forEach(btn=>btn.addEventListener('click',()=>{
    if(btn.dataset.toneAnswer==='4'){btn.classList.add('correct');passedQuizzes.add(current);setQuizContinueEnabled(true);return}
    btn.classList.add('wrong');wrong.add(btn.dataset.toneAnswer);
    if(wrong.size>=4){const correct=document.querySelector('[data-tone-answer="4"]');if(correct)correct.classList.add('correct')}
  }));
}

let lessonAudio=null,lessonAudioPage=null,audioNavigationToken=0;

function stopLessonAudio(){
  if(lessonAudio){
    try{lessonAudio.pause();lessonAudio.currentTime=0}catch(_){}
  }
  lessonAudio=null;lessonAudioPage=null;
  document.querySelector('.lesson-audio-btn')?.classList.remove('playing');
}
function playLessonAudio(pageNumber){
  const spec=LESSON_AUDIO[pageNumber]; if(!spec)return;
  if(!lessonAudio||lessonAudioPage!==pageNumber){
    stopLessonAudio();
    lessonAudio=new Audio(spec.file);
    lessonAudio.preload='metadata';
    lessonAudioPage=pageNumber;
    lessonAudio.addEventListener('ended',()=>document.querySelector('.lesson-audio-btn')?.classList.remove('playing'));
  }else{
    try{lessonAudio.pause();lessonAudio.currentTime=0}catch(_){}
  }
  const btn=document.querySelector('.lesson-audio-btn');
  btn?.classList.add('playing');
  const p=lessonAudio.play();
  if(p&&typeof p.catch==='function')p.catch(err=>{
    btn?.classList.remove('playing');
    console.warn('Lesson audio playback failed or was blocked:',spec.file,err);
  });
}

function labelNote(n){return n.replace(/s/,'♯').replace(/b/,'♭').replace(/\d/,'').toUpperCase()}
function makeKeyboard(){const kb=$('#kb'),white=['c4','d4','e4','f4','g4','a4','b4','c5'],black=[['cs4',12.5],['ds4',25],['fs4',50],['gs4',62.5],['as4',75]];kb.innerHTML=white.map(n=>`<div class="white-key" data-note="${n}">${n.replace('4','').replace('5','').toUpperCase()}</div>`).join('')+black.map(([n,l])=>`<div class="black-key" style="left:${l}%" data-note="${n}">${n[0].toUpperCase()}♯</div>`).join('');kb.querySelectorAll('[data-note]').forEach(k=>k.onclick=()=>{play(k.dataset.note);highlightKeys([k.dataset.note]);$('#kr').textContent=k.dataset.note.replace('s','♯').toUpperCase()})}
function highlightKeys(ns){document.querySelectorAll('#kb [data-note]').forEach(k=>k.classList.toggle('on',ns.includes(k.dataset.note)))}
function showStep(i,doScroll=true){
  const previous=current;
  $('#siteFooter').style.display='none';
  current=i;
  document.body.classList.add('lesson-active');
  home.classList.add('hidden');
  summary.classList.add('hidden');
  lesson.classList.remove('hidden');
  lesson.classList.toggle('opening',i<2);
  $('#progress').style.width=((i+1)/steps.length*100)+'%';
  $('#prevBtn').textContent=i===0?'返回首页':'← 上一步';
  $('#nextBtn').textContent=i===steps.length-1?'完成学习':'继续 →';
  setQuizContinueEnabled(![13,21,22].includes(i) || passedQuizzes.has(i));
  steps[i].render();
  refreshLessonAudioForPage(i);
  updateHeaderLessonCount(i);
  revealNewestLessonText();
  if(doScroll){
    requestAnimationFrame(()=>{
      if(i>previous) revealNewestLessonText();
      else body.scrollTo({top:0,behavior:'smooth'});
    });
  }
}

$('#nextBtn').onclick=()=>{
  if(current<steps.length-1)showStep(current+1);
  else showSummary();
};

// 页面切换时重新渲染谱例；不在 resize 时重置当前互动状态。

(function(){
  let lastTouchEnd=0;
  document.addEventListener('touchend',function(e){
    if(e.touches && e.touches.length>0) return;
    const now=Date.now();
    if(now-lastTouchEnd<=300){
      e.preventDefault();
    }
    lastTouchEnd=now;
  },{passive:false});
})();


/* Desktop keyboard navigation.
   ArrowLeft / ArrowUp  = Previous
   ArrowRight / ArrowDown = Continue
   Touch/click navigation remains unchanged. */
document.addEventListener('keydown',function(e){
  if(!document.body.classList.contains('lesson-active')) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const target=e.target;
  if(target && (target.matches?.('input,textarea,select') || target.isContentEditable)) return;

  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){
    e.preventDefault();
    document.getElementById('prevBtn')?.click();
  }else if(e.key==='ArrowRight'||e.key==='ArrowDown'){
    e.preventDefault();
    document.getElementById('nextBtn')?.click();
  }
});
