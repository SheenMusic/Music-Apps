<script>
const ENDPOINT='https://formspree.io/f/xyezovwb';
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);let method='支付宝', order='';
const PAY_LINKS={支付宝:'https://qr.alipay.com/fkx13921kb0l57ujqpulsb8'};
const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
function showStep(n){$$('.step').forEach(x=>x.classList.remove('active'));$('#step'+n).classList.add('active');$('.sheet').scrollTop=0}
function openBuy(tier){$('#overlay').classList.add('open');syncVisualViewport();document.body.style.overflow='hidden';document.querySelector(`input[name="tier"][value="${tier}"]`).checked=true;syncTier();showStep(1);setTimeout(()=>$('#email').focus(),120)}
function closeBuy(){ $('#overlay').classList.remove('open');document.body.style.overflow=''; }
function syncTier(){const v=$('input[name="tier"]:checked').value;$('#commentField').style.display=v==='2'?'block':'none'}
function makeOrder(){const d=new Date(), pad=n=>String(n).padStart(2,'0'), chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let r='';for(let i=0;i<4;i++)r+=chars[Math.floor(Math.random()*chars.length)];return `JN-${String(d.getFullYear()).slice(2)}${pad(d.getMonth()+1)}${pad(d.getDate())}-${r}`}
$('#buyBtn').onclick=()=>openBuy('5');$('#supportBtn').onclick=()=>openBuy('2');$('#closeBtn').onclick=closeBuy;$('#doneBtn').onclick=closeBuy;$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeBuy()});$$('input[name="tier"]').forEach(x=>x.addEventListener('change',syncTier));
$('#toPay').addEventListener('pointerdown',e=>e.preventDefault());
$('#toPay').onclick=()=>{const email=$('#email').value.trim();if(!/^\S+@\S+\.\S+$/.test(email)){ $('#emailError').style.display='block';requestAnimationFrame(()=>{const el=$('#email');el.focus({preventScroll:true});try{el.setSelectionRange(el.value.length,el.value.length)}catch(_){}el.scrollIntoView({block:'center',behavior:'smooth'})});return}$('#emailError').style.display='none';const tier=$('input[name="tier"]:checked').value;order=makeOrder();$('#orderId').textContent=order;$('#amount').textContent=$('#amountHint').textContent='¥'+tier;$('#tierLabel').textContent=tier==='2'?'视频留言支持价':'直接购买';$('#emailShow').textContent=email;showStep(2);syncPaymentUI()};
function syncPaymentUI(){
 const wx=method==='微信', img=wx?'./assets/wechat-pay.jpg':'./assets/alipay.jpg';
 $('#qrImg').src=img;$('#qrImg').alt=method+'收款二维码';
 $('#saveQr').href=img;$('#saveQr').download=method+'收款码.jpg';
 $('#wechatWarning').classList.toggle('show',wx);
 if(isMobile){
   $('#mobilePay').classList.add('show');
   $('#openPay').style.display=wx?'none':'block';
   $('#mobileNote').style.display=wx?'none':'block';
   if(!wx){$('#openPay').href=PAY_LINKS.支付宝;$('#openPay').textContent='打开支付宝付款'}
   $('#payHint').innerHTML=wx?`请支付 <strong id="amountHint">${$('#amount').textContent}</strong>。<br>保存下方收款码后，在微信中从相册识别。`:`手机支付 <strong id="amountHint">${$('#amount').textContent}</strong>。<br>推荐直接打开支付宝完成付款。`;
 }else{
   $('#mobilePay').classList.remove('show');
   $('#payHint').innerHTML=`请扫码支付 <strong id="amountHint">${$('#amount').textContent}</strong>。<br>付款完成后，再点击下面的按钮提交订单。`;
 }
}
$$('.method').forEach(b=>b.onclick=()=>{method=b.dataset.method;$$('.method').forEach(x=>x.classList.toggle('active',x===b));syncPaymentUI()});
$('#backBtn').onclick=()=>showStep(1);
function orderText(data){return `订单号：${data.order_id}\n商品：${data.product}\n金额：${data.amount}\n购买方式：${data.purchase_type}\n支付方式：${data.payment_method}\n接收邮箱：${data.buyer_email}\n付款昵称：${data.payment_name}\n留言昵称：${data.comment_name}`}
function showSubmitFailure(data){$('#submitError').style.display='block';$('#fallback').style.display='block';$('#orderCopy').textContent=orderText(data);$('.sheet').scrollTo({top:$('.sheet').scrollHeight,behavior:'smooth'})}
$('#copyOrder').onclick=async()=>{const text=$('#orderCopy').textContent,btn=$('#copyOrder');try{await navigator.clipboard.writeText(text);btn.textContent='已复制'}catch(_){const r=document.createRange();r.selectNodeContents($('#orderCopy'));const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);btn.textContent='请长按复制上方信息'}setTimeout(()=>btn.textContent='复制订单信息',1800)};
$('#paidBtn').onclick=async()=>{const btn=$('#paidBtn');btn.disabled=true;btn.textContent='正在提交…';$('#submitError').style.display='none';$('#fallback').style.display='none';const tier=$('input[name="tier"]:checked').value,email=$('#email').value.trim();const data={_subject:`新订单｜江南｜¥${tier}｜${order}`,order_id:order,product:'江南 · 钢琴前奏谱',amount:`¥${tier}`,purchase_type:tier==='2'?'视频留言支持价':'直接购买',payment_method:method,buyer_email:email,payment_name:$('#payName').value.trim()||'未填写',comment_name:$('#commentName').value.trim()||'未填写',submitted_at:new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})};
const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
try{const res=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(data),signal:controller.signal});let body=null;try{body=await res.json()}catch(_){}if(!res.ok)throw new Error(body?.error||`HTTP ${res.status}`);$('#doneOrder').textContent=order;$('#doneEmail').textContent=email;showStep(3)}catch(e){console.error('Order submission failed:',e);showSubmitFailure(data)}finally{clearTimeout(timer);btn.disabled=false;btn.textContent='重新提交订单'}};

function syncVisualViewport(){
 const vv=window.visualViewport;
 const root=document.documentElement;
 if(vv){root.style.setProperty('--vv-height',vv.height+'px');root.style.setProperty('--vv-top',vv.offsetTop+'px')}
 else{root.style.setProperty('--vv-height',window.innerHeight+'px');root.style.setProperty('--vv-top','0px')}
}
if(window.visualViewport){visualViewport.addEventListener('resize',syncVisualViewport);visualViewport.addEventListener('scroll',syncVisualViewport)}
window.addEventListener('resize',syncVisualViewport);syncVisualViewport();
$('#email').addEventListener('input',()=>{$('#emailError').style.display='none'});

document.getElementById('year').textContent=new Date().getFullYear();
</script>
