<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f3ee"><title>Ear Training · 第一课</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div> EAR TRAINING · INTERVAL</div><div>LESSON 01</div></header><main>
<section id="start" class="screen active"><div class="eyebrow">自然音程听觉训练 · 第一课</div><h1>音的方向<br><span></h1><p>建立最基本的听觉参照：声音向上还是向下？</p><div class="meta"><span>为了听清细节，建议使用有线耳机，并在相对安静的环境中完成练习</div><div class="modeGrid"><button id="trainingBtn" class="modeCard"><strong>练习模式</strong><span>判断随机生成的旋律音程的方向，熟练后可随时通过界面右上角的“返回模式选择”中止练习，然后进入“测验模式”</span></button><button id="testBtn" class="modeCard"><strong>测验模式</strong><span>共 20 个题目，约用时 2 分钟，中途退出后需要重新开始。全部完成后，复制测验结果发送给老师获取本课评价</span></button></div></section>
<section id="quiz" class="screen"><div class="quizTop"><div><div class="modeBadge" id="modeBadge"></div><div class="progressText" id="progress"></div></div><button id="quit" class="quit">返回模式选择</button></div><div class="bar"><i id="bar"></i></div><div class="audio"><small>LISTEN</small><button id="play" class="play" aria-label="播放音频">▶</button><div>点击播放 · 可重复聆听</div></div><div class="questionLabel">QUESTION</div><h2 id="question"></h2><div id="options" class="options"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="next" disabled>下一题 →</button></section>
